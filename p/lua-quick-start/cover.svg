<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#A8D098"/>
          <stop offset="1" stop-color="#5C8C5C"/>
    </linearGradient>
      <radialGradient id="light" cx="0.5" cy="0" r="0.7">
          <stop offset="0" stop-color="#FFFFA0" stop-opacity="0.45"/>
          <stop offset="1" stop-color="#FFFFA0" stop-opacity="0"/>
      </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
    <ellipse cx="600" cy="0" rx="600" ry="500" fill="url(#light)"/>

    <!-- Distant bamboo wash -->
    <g stroke="#3D6840" stroke-width="3" opacity="0.4">
        <line x1="80" y1="0" x2="80" y2="630"/>
        <line x1="160" y1="0" x2="160" y2="630"/>
        <line x1="220" y1="0" x2="220" y2="630"/>
        <line x1="320" y1="0" x2="320" y2="630"/>
        <line x1="400" y1="0" x2="400" y2="630"/>
        <line x1="480" y1="0" x2="480" y2="630"/>
        <line x1="560" y1="0" x2="560" y2="630"/>
        <line x1="640" y1="0" x2="640" y2="630"/>
        <line x1="720" y1="0" x2="720" y2="630"/>
        <line x1="800" y1="0" x2="800" y2="630"/>
        <line x1="880" y1="0" x2="880" y2="630"/>
        <line x1="960" y1="0" x2="960" y2="630"/>
        <line x1="1040" y1="0" x2="1040" y2="630"/>
        <line x1="1120" y1="0" x2="1120" y2="630"/>
    </g>

    <!-- Foreground bamboo stalks -->
    <g>
        <g transform="translate(140,0)">
            <rect x="-7" y="0" width="14" height="630" fill="#7CAC68"/>
            <line x1="-7" y1="120" x2="7" y2="120" stroke="#3D6840" stroke-width="3"/>
            <line x1="-7" y1="220" x2="7" y2="220" stroke="#3D6840" stroke-width="3"/>
            <line x1="-7" y1="320" x2="7" y2="320" stroke="#3D6840" stroke-width="3"/>
            <line x1="-7" y1="420" x2="7" y2="420" stroke="#3D6840" stroke-width="3"/>
            <line x1="-7" y1="520" x2="7" y2="520" stroke="#3D6840" stroke-width="3"/>
        </g>
        <g transform="translate(340,0)">
            <rect x="-9" y="0" width="18" height="630" fill="#9CC880"/>
            <line x1="-9" y1="100" x2="9" y2="100" stroke="#3D6840" stroke-width="3"/>
            <line x1="-9" y1="200" x2="9" y2="200" stroke="#3D6840" stroke-width="3"/>
            <line x1="-9" y1="300" x2="9" y2="300" stroke="#3D6840" stroke-width="3"/>
            <line x1="-9" y1="400" x2="9" y2="400" stroke="#3D6840" stroke-width="3"/>
            <line x1="-9" y1="500" x2="9" y2="500" stroke="#3D6840" stroke-width="3"/>
    </g>
        <g transform="translate(620,0)">
            <rect x="-11" y="0" width="22" height="630" fill="#7CAC68"/>
            <line x1="-11" y1="140" x2="11" y2="140" stroke="#3D6840" stroke-width="3"/>
            <line x1="-11" y1="240" x2="11" y2="240" stroke="#3D6840" stroke-width="3"/>
            <line x1="-11" y1="340" x2="11" y2="340" stroke="#3D6840" stroke-width="3"/>
            <line x1="-11" y1="440" x2="11" y2="440" stroke="#3D6840" stroke-width="3"/>
    </g>
        <g transform="translate(880,0)">
            <rect x="-9" y="0" width="18" height="630" fill="#9CC880"/>
            <line x1="-9" y1="110" x2="9" y2="110" stroke="#3D6840" stroke-width="3"/>
            <line x1="-9" y1="210" x2="9" y2="210" stroke="#3D6840" stroke-width="3"/>
            <line x1="-9" y1="310" x2="9" y2="310" stroke="#3D6840" stroke-width="3"/>
            <line x1="-9" y1="410" x2="9" y2="410" stroke="#3D6840" stroke-width="3"/>
            <line x1="-9" y1="510" x2="9" y2="510" stroke="#3D6840" stroke-width="3"/>
    </g>
        <g transform="translate(1080,0)">
            <rect x="-7" y="0" width="14" height="630" fill="#7CAC68"/>
            <line x1="-7" y1="130" x2="7" y2="130" stroke="#3D6840" stroke-width="3"/>
            <line x1="-7" y1="230" x2="7" y2="230" stroke="#3D6840" stroke-width="3"/>
            <line x1="-7" y1="330" x2="7" y2="330" stroke="#3D6840" stroke-width="3"/>
            <line x1="-7" y1="430" x2="7" y2="430" stroke="#3D6840" stroke-width="3"/>
    </g>
    </g>

    <!-- Bamboo leaves scattered -->
    <g fill="#3D6840" opacity="0.85">
        <ellipse cx="200" cy="180" rx="20" ry="5" transform="rotate(-30 200 180)"/>
        <ellipse cx="400" cy="240" rx="22" ry="5" transform="rotate(20 400 240)"/>
        <ellipse cx="700" cy="160" rx="20" ry="5" transform="rotate(-15 700 160)"/>
        <ellipse cx="950" cy="280" rx="22" ry="5" transform="rotate(35 950 280)"/>
        <ellipse cx="540" cy="380" rx="20" ry="5" transform="rotate(-25 540 380)"/>
        <ellipse cx="810" cy="450" rx="22" ry="5" transform="rotate(15 810 450)"/>
  </g>

    <!-- Light shafts -->
    <g fill="#FFFFA0" opacity="0.18">
        <polygon points="200,0 280,0 220,630 140,630"/>
        <polygon points="700,0 780,0 720,630 640,630"/>
    </g>

    <text x="60" y="610" fill="#1F3820" font-family="-apple-system, sans-serif" font-size="14" opacity="0.8"
          letter-spacing="2">lingcoder.com
    </text>
</svg>
