<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#F5C8E0"/>
          <stop offset="0.5" stop-color="#C8A5D8"/>
          <stop offset="1" stop-color="#8C6CB0"/>
      </linearGradient>
      <linearGradient id="lavBack" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#8C6CB0"/>
          <stop offset="1" stop-color="#5E3F8A"/>
      </linearGradient>
      <linearGradient id="lavFront" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#6E4C9A"/>
          <stop offset="1" stop-color="#3D245C"/>
    </linearGradient>
  </defs>

    <rect width="1200" height="380" fill="url(#sky)"/>

    <!-- Sun -->
    <circle cx="900" cy="200" r="48" fill="#FFE3D0" opacity="0.95"/>

    <!-- Distant rolling hills -->
    <path d="M 0 350 Q 200 300 400 340 T 800 320 T 1200 350 L 1200 380 L 0 380 Z"
          fill="#A89BC8" opacity="0.7"/>

    <!-- Lavender field back -->
    <rect y="380" width="1200" height="100" fill="url(#lavBack)"/>

    <!-- Lavender stripes back -->
    <g fill="#7B5C9E" opacity="0.7">
        <path d="M 0 390 Q 200 380 400 388 T 800 385 T 1200 390 L 1200 410 L 0 410 Z"/>
        <path d="M 0 420 Q 200 410 400 418 T 800 415 T 1200 420 L 1200 440 L 0 440 Z"/>
        <path d="M 0 450 Q 200 440 400 448 T 800 445 T 1200 450 L 1200 470 L 0 470 Z"/>
  </g>

    <!-- Lavender field front -->
    <rect y="480" width="1200" height="150" fill="url(#lavFront)"/>

    <!-- Lavender stripes front -->
    <g fill="#3D245C">
        <path d="M 0 495 Q 300 485 600 493 T 1200 495 L 1200 510 L 0 510 Z"/>
        <path d="M 0 525 Q 300 515 600 523 T 1200 525 L 1200 545 L 0 545 Z"/>
        <path d="M 0 560 Q 300 550 600 558 T 1200 560 L 1200 585 L 0 585 Z"/>
    </g>

    <!-- Tree silhouette -->
    <g fill="#2E1A40">
        <ellipse cx="200" cy="340" rx="40" ry="50"/>
        <rect x="196" y="340" width="8" height="50"/>
    </g>

    <!-- Stone farmhouse -->
    <g fill="#FAEAD8">
        <rect x="700" y="295" width="80" height="55"/>
        <polygon points="700,295 740,260 780,295"/>
        <rect x="725" y="320" width="14" height="30" fill="#5E3F8A"/>
        <rect x="755" y="312" width="12" height="14" fill="#5E3F8A"/>
        <rect x="708" y="312" width="12" height="14" fill="#5E3F8A"/>
    </g>
    <!-- Roof -->
    <polygon points="695,295 740,255 785,295" fill="#A8745C"/>

    <text x="60" y="608" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="14" opacity="0.75"
          letter-spacing="2">lingcoder.com
    </text>
</svg>
