<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
    <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#3A4A8C"/>
            <stop offset="0.5" stop-color="#A85F8A"/>
            <stop offset="1" stop-color="#FFB570"/>
        </linearGradient>
        <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#3D5A7C"/>
            <stop offset="1" stop-color="#1A2A48"/>
        </linearGradient>
        <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#FFE5A0" stop-opacity="0.95"/>
            <stop offset="1" stop-color="#FFE5A0" stop-opacity="0"/>
        </radialGradient>
    </defs>

    <rect width="1200" height="380" fill="url(#sky)"/>

    <!-- Wisp clouds -->
    <g fill="#FFC890" opacity="0.55">
        <ellipse cx="200" cy="150" rx="120" ry="6"/>
        <ellipse cx="900" cy="100" rx="140" ry="7"/>
        <ellipse cx="1080" cy="200" rx="100" ry="5"/>
    </g>

    <!-- Sun setting -->
    <circle cx="380" cy="310" r="50" fill="#FFE5A0" opacity="0.92"/>
    <circle cx="380" cy="310" r="160" fill="#FFE5A0" opacity="0.18"/>

    <!-- Sea -->
    <rect y="380" width="1200" height="160" fill="url(#sea)"/>

    <!-- Sun reflection on sea -->
    <g fill="#FFE5A0" opacity="0.5">
        <ellipse cx="380" cy="395" rx="55" ry="3.5"/>
        <ellipse cx="380" cy="415" rx="42" ry="3"/>
        <ellipse cx="380" cy="435" rx="32" ry="2.5"/>
        <ellipse cx="380" cy="455" rx="22" ry="2"/>
    </g>

    <!-- Wave whitecaps -->
    <g fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5">
        <path d="M 100 470 q 30 -5 60 0 t 60 0"/>
        <path d="M 600 480 q 30 -5 60 0 t 60 0"/>
        <path d="M 900 470 q 30 -5 60 0 t 60 0"/>
        <path d="M 250 510 q 40 -6 80 0 t 80 0"/>
        <path d="M 750 515 q 40 -6 80 0 t 80 0"/>
    </g>

    <!-- Rock cliff right -->
    <path d="M 850 380 L 900 320 L 1000 280 L 1100 290 L 1200 320 L 1200 540 L 850 540 Z"
          fill="#3A2D2A"/>
    <!-- Rock detail -->
    <g fill="#5C4A3D" opacity="0.65">
        <polygon points="900,330 940,320 920,360"/>
        <polygon points="1020,310 1060,300 1040,340"/>
    </g>

    <!-- Lighthouse -->
    <g transform="translate(990,80)">
        <!-- Base -->
        <rect x="-25" y="200" width="50" height="35" fill="#5C5C5C"/>
        <!-- Body (red/white stripes) -->
        <rect x="-15" y="20" width="30" height="180" fill="#F0F0EE"/>
        <rect x="-15" y="20" width="30" height="20" fill="#D8401C"/>
        <rect x="-15" y="60" width="30" height="20" fill="#D8401C"/>
        <rect x="-15" y="100" width="30" height="20" fill="#D8401C"/>
        <rect x="-15" y="140" width="30" height="20" fill="#D8401C"/>
        <rect x="-15" y="180" width="30" height="20" fill="#D8401C"/>
        <!-- Top platform -->
        <rect x="-22" y="0" width="44" height="22" fill="#3A2D2A"/>
        <!-- Lamp room -->
        <rect x="-12" y="-26" width="24" height="26" fill="#FFE5A0"/>
        <!-- Roof -->
        <polygon points="-15,-26 0,-50 15,-26" fill="#3A2D2A"/>
        <!-- Glow -->
        <circle cx="0" cy="-13" r="60" fill="url(#lampGlow)"/>
        <!-- Light beam -->
        <polygon points="0,-13 -200,-200 -200,200" fill="#FFE5A0" opacity="0.18"/>
    </g>

    <!-- Foreground rocks -->
    <ellipse cx="100" cy="555" rx="120" ry="14" fill="#1F1A18"/>
    <ellipse cx="500" cy="565" rx="100" ry="12" fill="#1F1A18"/>

    <text x="60" y="610" fill="#FFE5A0" font-family="-apple-system, sans-serif" font-size="14" opacity="0.8"
          letter-spacing="2">lingcoder.com
    </text>
</svg>
