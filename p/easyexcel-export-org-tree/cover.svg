<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
    <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#A0C4DC"/>
            <stop offset="1" stop-color="#E8DAB0"/>
        </linearGradient>
        <linearGradient id="river" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#7CA8C0"/>
            <stop offset="0.5" stop-color="#A8D0E0"/>
            <stop offset="1" stop-color="#5C8AA8"/>
        </linearGradient>
    </defs>

    <rect width="1200" height="280" fill="url(#sky)"/>

    <!-- Soft clouds -->
    <g fill="#FFFFFF" opacity="0.7">
        <ellipse cx="200" cy="80" rx="100" ry="12"/>
        <ellipse cx="900" cy="60" rx="120" ry="14"/>
    </g>

    <!-- Distant mountain -->
    <path d="M 0 280 L 200 130 L 400 220 L 600 100 L 800 210 L 1000 130 L 1200 230 L 1200 320 L 0 320 Z"
          fill="#7B95AA" opacity="0.85"/>
    <g fill="#FFFFFF">
        <path d="M 200 130 L 240 195 L 160 195 Z"/>
        <path d="M 600 100 L 640 175 L 560 175 Z"/>
        <path d="M 1000 130 L 1040 200 L 960 200 Z"/>
    </g>

    <!-- Mid mountain -->
    <path d="M 0 320 L 150 220 L 320 290 L 500 200 L 680 280 L 870 220 L 1050 290 L 1200 250 L 1200 380 L 0 380 Z"
          fill="#5C7855"/>

    <!-- Foreground hills -->
    <path d="M 0 380 L 200 320 L 400 360 L 540 340 L 660 340 L 800 360 L 1000 320 L 1200 380 L 1200 630 L 0 630 Z"
          fill="#3A5C2A"/>

    <!-- Pine trees on slopes -->
    <g fill="#1F3A18">
        <polygon points="100,400 90,360 110,360 95,335 115,335 100,310"/>
        <polygon points="180,395 170,355 190,355 175,330 195,330 180,305"/>
        <polygon points="280,400 270,360 290,360 275,335 295,335 280,310"/>
        <polygon points="900,400 890,360 910,360 895,335 915,335 900,310"/>
        <polygon points="1000,395 990,355 1010,355 995,330 1015,330 1000,305"/>
        <polygon points="1080,400 1070,360 1090,360 1075,335 1095,335 1080,310"/>
    </g>

    <!-- River winding through valley -->
    <path d="M 540 340 Q 580 400 540 460 Q 500 520 600 580 Q 700 620 660 630 L 460 630 Q 480 580 500 520 Q 540 460 500 400 Q 480 360 540 340 Z"
          fill="url(#river)"/>

    <!-- River shine -->
    <g fill="#FFFFFF" opacity="0.5">
        <ellipse cx="540" cy="400" rx="6" ry="2"/>
        <ellipse cx="520" cy="460" rx="6" ry="2"/>
        <ellipse cx="560" cy="520" rx="6" ry="2"/>
        <ellipse cx="600" cy="580" rx="6" ry="2"/>
    </g>

    <!-- Foreground rocks -->
    <g fill="#1A2810">
        <ellipse cx="120" cy="600" rx="80" ry="12"/>
        <ellipse cx="1080" cy="610" rx="80" ry="12"/>
    </g>

    <!-- Pines foreground (frame) -->
    <g fill="#0F1F0A">
        <polygon points="60,600 40,500 80,500 50,440 90,440 60,380"/>
        <polygon points="1130,610 1110,510 1150,510 1120,450 1160,450 1130,390"/>
    </g>

    <text x="60" y="618" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="14" opacity="0.85"
          letter-spacing="2">lingcoder.com
    </text>
</svg>
