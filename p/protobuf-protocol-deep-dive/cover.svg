<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#FFB880"/>
          <stop offset="1" stop-color="#FFE0B0"/>
      </linearGradient>
      <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#7CB8C8"/>
          <stop offset="1" stop-color="#3D7080"/>
    </linearGradient>
  </defs>

    <rect width="1200" height="380" fill="url(#sky)"/>

    <!-- Sun -->
    <circle cx="900" cy="150" r="50" fill="#FFE0A0" opacity="0.95"/>
    <circle cx="900" cy="150" r="120" fill="#FFE0A0" opacity="0.2"/>

    <!-- Distant mountains -->
    <path d="M 0 380 L 150 290 L 300 330 L 480 270 L 640 320 L 800 280 L 960 320 L 1100 290 L 1200 320 L 1200 400 L 0 400 Z"
          fill="#A87858" opacity="0.6"/>

    <!-- Foreground autumn forest line -->
    <g>
        <g transform="translate(80,400)">
            <ellipse cx="0" cy="-30" rx="55" ry="40" fill="#E04830"/>
            <ellipse cx="-20" cy="-15" rx="35" ry="25" fill="#FF7028"/>
            <ellipse cx="25" cy="-25" rx="40" ry="28" fill="#E03020"/>
            <rect x="-5" y="0" width="10" height="40" fill="#5C3820"/>
        </g>
        <g transform="translate(220,400)">
            <ellipse cx="0" cy="-35" rx="60" ry="45" fill="#FF8838"/>
            <ellipse cx="-25" cy="-20" rx="40" ry="28" fill="#FFB048"/>
            <ellipse cx="28" cy="-30" rx="42" ry="30" fill="#E04830"/>
            <rect x="-6" y="0" width="12" height="40" fill="#5C3820"/>
        </g>
        <g transform="translate(380,400)">
            <ellipse cx="0" cy="-30" rx="55" ry="40" fill="#FFB048"/>
            <ellipse cx="-20" cy="-15" rx="35" ry="25" fill="#FFD058"/>
            <ellipse cx="25" cy="-25" rx="40" ry="28" fill="#FF8838"/>
            <rect x="-5" y="0" width="10" height="40" fill="#5C3820"/>
    </g>
        <g transform="translate(820,400)">
            <ellipse cx="0" cy="-30" rx="55" ry="40" fill="#E04830"/>
            <ellipse cx="-20" cy="-15" rx="35" ry="25" fill="#FFB048"/>
            <ellipse cx="25" cy="-25" rx="40" ry="28" fill="#FF7028"/>
            <rect x="-5" y="0" width="10" height="40" fill="#5C3820"/>
    </g>
        <g transform="translate(960,400)">
            <ellipse cx="0" cy="-35" rx="60" ry="45" fill="#FFB048"/>
            <ellipse cx="-25" cy="-20" rx="40" ry="28" fill="#FFD058"/>
            <ellipse cx="28" cy="-30" rx="42" ry="30" fill="#FF7028"/>
            <rect x="-6" y="0" width="12" height="40" fill="#5C3820"/>
    </g>
        <g transform="translate(1100,400)">
            <ellipse cx="0" cy="-30" rx="55" ry="40" fill="#E04830"/>
            <ellipse cx="-20" cy="-15" rx="35" ry="25" fill="#FF7028"/>
            <rect x="-5" y="0" width="10" height="40" fill="#5C3820"/>
        </g>
    </g>

    <!-- River -->
    <path d="M 0 440 Q 300 430 600 450 Q 900 430 1200 460 L 1200 540 Q 900 520 600 540 Q 300 520 0 540 Z"
          fill="url(#river)"/>

    <!-- River reflection of trees -->
    <g opacity="0.45">
        <ellipse cx="80" cy="475" rx="50" ry="8" fill="#E04830"/>
        <ellipse cx="220" cy="480" rx="55" ry="9" fill="#FF8838"/>
        <ellipse cx="380" cy="478" rx="50" ry="8" fill="#FFB048"/>
        <ellipse cx="820" cy="478" rx="50" ry="8" fill="#E04830"/>
        <ellipse cx="960" cy="480" rx="55" ry="9" fill="#FFB048"/>
    </g>

    <!-- River ripples -->
    <g fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.5">
        <path d="M 100 510 q 30 -3 60 0 t 60 0"/>
        <path d="M 500 525 q 30 -3 60 0 t 60 0"/>
        <path d="M 900 510 q 30 -3 60 0 t 60 0"/>
  </g>

    <!-- River bank with leaves -->
    <path d="M 0 540 Q 600 520 1200 545 L 1200 630 L 0 630 Z" fill="#7C5838"/>
    <path d="M 0 580 Q 600 565 1200 585 L 1200 630 L 0 630 Z" fill="#5C3818"/>

    <!-- Floating leaves -->
    <g>
        <g transform="translate(300,485) rotate(20)" fill="#E04830">
            <path d="M 0 0 Q -8 -5 -10 0 Q -8 5 0 0 M 0 0 Q 8 -5 10 0 Q 8 5 0 0"/>
        </g>
        <g transform="translate(550,495) rotate(-15)" fill="#FFB048">
            <path d="M 0 0 Q -8 -5 -10 0 Q -8 5 0 0 M 0 0 Q 8 -5 10 0 Q 8 5 0 0"/>
        </g>
        <g transform="translate(750,490) rotate(35)" fill="#FF7028">
            <path d="M 0 0 Q -8 -5 -10 0 Q -8 5 0 0 M 0 0 Q 8 -5 10 0 Q 8 5 0 0"/>
        </g>
    </g>

    <text x="60" y="615" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="14" opacity="0.85"
          letter-spacing="2">lingcoder.com
    </text>
</svg>
