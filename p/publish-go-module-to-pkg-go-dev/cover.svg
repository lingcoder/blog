<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#FFC890"/>
          <stop offset="0.5" stop-color="#FF8C5C"/>
          <stop offset="1" stop-color="#A85A30"/>
      </linearGradient>
      <linearGradient id="rocks" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#D8542C"/>
          <stop offset="1" stop-color="#7C2814"/>
    </linearGradient>
      <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#7BA8C8"/>
          <stop offset="1" stop-color="#3D6080"/>
      </linearGradient>
  </defs>

    <rect width="1200" height="320" fill="url(#sky)"/>

    <!-- Sun -->
    <circle cx="600" cy="240" r="55" fill="#FFE5A0" opacity="0.95"/>
    <circle cx="600" cy="240" r="170" fill="#FFE5A0" opacity="0.2"/>

    <!-- Distant mesa (red rock) -->
    <path d="M 0 320 L 140 220 L 250 200 L 350 220 L 470 200 L 580 240 L 700 200 L 820 220 L 940 200 L 1050 220 L 1200 240 L 1200 320 Z"
          fill="#A8542C" opacity="0.55"/>

    <!-- Mid mesa with strata -->
    <path d="M 0 320 L 80 250 L 230 230 L 380 250 L 530 220 L 680 250 L 830 230 L 980 260 L 1120 240 L 1200 270 L 1200 320 Z"
          fill="url(#rocks)" opacity="0.95"/>

    <!-- Strata lines -->
    <g fill="none" stroke="#5C1F08" stroke-width="1.5" opacity="0.45">
        <path d="M 0 280 Q 200 270 400 280 T 800 275 T 1200 280"/>
        <path d="M 0 295 Q 200 285 400 295 T 800 290 T 1200 295"/>
    </g>

    <!-- Canyon walls left and right -->
    <path d="M 0 320 L 0 630 L 320 630 L 280 580 L 200 530 L 230 470 L 180 410 L 220 360 L 150 320 L 100 320 Z"
          fill="#5C1F08"/>
    <path d="M 1200 320 L 1200 630 L 880 630 L 920 580 L 1000 530 L 970 470 L 1020 410 L 980 360 L 1050 320 L 1100 320 Z"
          fill="#5C1F08"/>

    <!-- Rock strata on canyon walls -->
    <g fill="#7C2A14">
        <rect x="0" y="380" width="320" height="14"/>
        <rect x="0" y="450" width="320" height="14"/>
        <rect x="0" y="525" width="320" height="14"/>
        <rect x="880" y="380" width="320" height="14"/>
        <rect x="880" y="450" width="320" height="14"/>
        <rect x="880" y="525" width="320" height="14"/>
    </g>

    <!-- River winding -->
    <path d="M 350 320 Q 600 380 480 460 Q 380 540 600 600 Q 800 620 850 600 Q 950 540 750 460 Q 600 380 850 320 Z"
          fill="url(#river)"/>

    <!-- River shine -->
    <g fill="#FFFFFF" opacity="0.4">
        <ellipse cx="500" cy="430" rx="8" ry="2"/>
        <ellipse cx="600" cy="510" rx="10" ry="2"/>
        <ellipse cx="750" cy="570" rx="8" ry="2"/>
  </g>

    <text x="60" y="610" fill="#FFE5A0" font-family="-apple-system, sans-serif" font-size="14" opacity="0.8"
          letter-spacing="2">lingcoder.com
    </text>
</svg>
