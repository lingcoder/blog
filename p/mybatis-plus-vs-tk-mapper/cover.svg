<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#5C2A6E"/>
          <stop offset="0.45" stop-color="#E0628C"/>
          <stop offset="1" stop-color="#FFB85C"/>
      </linearGradient>
      <linearGradient id="duneFar" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#E89B5C"/>
          <stop offset="1" stop-color="#A8602A"/>
    </linearGradient>
      <linearGradient id="duneNear" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#A8602A"/>
          <stop offset="1" stop-color="#5C2D1F"/>
      </linearGradient>
  </defs>

    <rect width="1200" height="380" fill="url(#sky)"/>

    <!-- Sun -->
    <circle cx="380" cy="280" r="60" fill="#FFE5A0"/>
    <circle cx="380" cy="280" r="180" fill="#FFE5A0" opacity="0.18"/>

    <!-- Distant dune line -->
    <path d="M 0 380 Q 200 340 400 360 Q 600 380 800 350 Q 1000 320 1200 360 L 1200 420 L 0 420 Z"
          fill="#C97548" opacity="0.7"/>

    <!-- Mid dunes -->
    <path d="M 0 420 Q 150 380 300 410 Q 450 440 600 400 Q 750 360 900 410 Q 1050 460 1200 410 L 1200 480 L 0 480 Z"
          fill="url(#duneFar)"/>

    <!-- Front dunes -->
    <path d="M 0 480 Q 200 420 400 470 Q 600 520 800 450 Q 1000 380 1200 460 L 1200 630 L 0 630 Z"
          fill="url(#duneNear)"/>

    <!-- Foreground dune ridge -->
    <path d="M 0 540 Q 300 480 600 530 Q 900 580 1200 530 L 1200 630 L 0 630 Z"
          fill="#3D1F0F"/>

    <!-- Dune ripple lines -->
    <g fill="none" stroke="#FFE5A0" stroke-width="1" opacity="0.25">
        <path d="M 100 600 q 50 -8 100 0 t 100 0 t 100 0 t 100 0 t 100 0 t 100 0"/>
        <path d="M 50 590 q 60 -10 120 0 t 120 0 t 120 0 t 120 0 t 120 0"/>
    </g>

    <!-- Camel silhouette -->
    <g fill="#2A1108" transform="translate(700,488)">
        <!-- Body -->
        <ellipse cx="0" cy="0" rx="32" ry="14"/>
        <!-- Two humps -->
        <ellipse cx="-10" cy="-12" rx="14" ry="10"/>
        <ellipse cx="10" cy="-12" rx="14" ry="10"/>
        <!-- Neck -->
        <path d="M -25 -5 Q -38 -22 -34 -36 L -28 -36 Q -28 -20 -16 -8 Z"/>
        <!-- Head -->
        <ellipse cx="-34" cy="-39" rx="8" ry="5"/>
        <!-- Legs -->
        <rect x="-22" y="6" width="4" height="22"/>
        <rect x="-12" y="6" width="4" height="22"/>
        <rect x="14" y="6" width="4" height="22"/>
        <rect x="22" y="6" width="4" height="22"/>
  </g>

    <text x="60" y="610" fill="#FFE5A0" font-family="-apple-system, sans-serif" font-size="14" opacity="0.8"
          letter-spacing="2">lingcoder.com
    </text>
</svg>
