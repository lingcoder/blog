<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#5DAEDF"/>
          <stop offset="1" stop-color="#A0D4E8"/>
      </linearGradient>
      <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#FFC845"/>
          <stop offset="1" stop-color="#A8782A"/>
    </linearGradient>
  </defs>

    <rect width="1200" height="350" fill="url(#sky)"/>

    <!-- Sun -->
    <circle cx="900" cy="160" r="60" fill="#FFE5A0"/>
    <circle cx="900" cy="160" r="180" fill="#FFE5A0" opacity="0.18"/>

    <!-- Soft clouds -->
    <g fill="#FFFFFF" opacity="0.85">
        <ellipse cx="200" cy="100" rx="100" ry="14"/>
        <ellipse cx="220" cy="95" rx="70" ry="10"/>
        <ellipse cx="500" cy="80" rx="80" ry="11"/>
        <ellipse cx="1080" cy="200" rx="90" ry="12"/>
    </g>

    <!-- Distant trees -->
    <g fill="#3A5C2A" opacity="0.75">
        <ellipse cx="80" cy="340" rx="40" ry="20"/>
        <ellipse cx="180" cy="338" rx="50" ry="22"/>
        <ellipse cx="290" cy="340" rx="45" ry="20"/>
        <ellipse cx="400" cy="338" rx="55" ry="22"/>
        <ellipse cx="520" cy="340" rx="50" ry="20"/>
        <ellipse cx="650" cy="338" rx="45" ry="22"/>
        <ellipse cx="780" cy="340" rx="50" ry="20"/>
        <ellipse cx="1000" cy="340" rx="55" ry="22"/>
        <ellipse cx="1140" cy="338" rx="50" ry="20"/>
  </g>

    <!-- Sunflower field background -->
    <rect y="350" width="1200" height="280" fill="url(#field)"/>

    <!-- Foreground sunflowers -->
    <g>
        <!-- big sunflower 1 -->
        <g transform="translate(200,440)">
            <line x1="0" y1="0" x2="0" y2="190" stroke="#3A5C2A" stroke-width="4"/>
            <ellipse cx="-15" cy="40" rx="25" ry="12" fill="#3A5C2A" transform="rotate(-30 -15 40)"/>
            <ellipse cx="15" cy="80" rx="25" ry="12" fill="#3A5C2A" transform="rotate(30 15 80)"/>
            <!-- petals -->
            <g fill="#FFC845">
                <ellipse cx="0" cy="-30" rx="8" ry="22"/>
                <ellipse cx="20" cy="-20" rx="8" ry="22" transform="rotate(40 20 -20)"/>
                <ellipse cx="30" cy="0" rx="8" ry="22" transform="rotate(80 30 0)"/>
                <ellipse cx="20" cy="20" rx="8" ry="22" transform="rotate(120 20 20)"/>
                <ellipse cx="0" cy="30" rx="8" ry="22"/>
                <ellipse cx="-20" cy="20" rx="8" ry="22" transform="rotate(120 -20 20)"/>
                <ellipse cx="-30" cy="0" rx="8" ry="22" transform="rotate(80 -30 0)"/>
                <ellipse cx="-20" cy="-20" rx="8" ry="22" transform="rotate(40 -20 -20)"/>
            </g>
            <circle cx="0" cy="0" r="14" fill="#5C3A1F"/>
        </g>

        <!-- big sunflower 2 -->
        <g transform="translate(550,420)">
            <line x1="0" y1="0" x2="0" y2="210" stroke="#3A5C2A" stroke-width="4"/>
            <ellipse cx="20" cy="50" rx="25" ry="12" fill="#3A5C2A" transform="rotate(30 20 50)"/>
            <g fill="#FFC845">
                <ellipse cx="0" cy="-32" rx="9" ry="24"/>
                <ellipse cx="22" cy="-22" rx="9" ry="24" transform="rotate(40 22 -22)"/>
                <ellipse cx="33" cy="0" rx="9" ry="24" transform="rotate(80 33 0)"/>
                <ellipse cx="22" cy="22" rx="9" ry="24" transform="rotate(120 22 22)"/>
                <ellipse cx="0" cy="32" rx="9" ry="24"/>
                <ellipse cx="-22" cy="22" rx="9" ry="24" transform="rotate(120 -22 22)"/>
                <ellipse cx="-33" cy="0" rx="9" ry="24" transform="rotate(80 -33 0)"/>
                <ellipse cx="-22" cy="-22" rx="9" ry="24" transform="rotate(40 -22 -22)"/>
            </g>
            <circle cx="0" cy="0" r="16" fill="#5C3A1F"/>
        </g>

        <!-- big sunflower 3 -->
        <g transform="translate(900,460)">
            <line x1="0" y1="0" x2="0" y2="170" stroke="#3A5C2A" stroke-width="4"/>
            <g fill="#FFC845">
                <ellipse cx="0" cy="-28" rx="8" ry="20"/>
                <ellipse cx="20" cy="-18" rx="8" ry="20" transform="rotate(40 20 -18)"/>
                <ellipse cx="28" cy="0" rx="8" ry="20" transform="rotate(80 28 0)"/>
                <ellipse cx="20" cy="18" rx="8" ry="20" transform="rotate(120 20 18)"/>
                <ellipse cx="0" cy="28" rx="8" ry="20"/>
                <ellipse cx="-20" cy="18" rx="8" ry="20" transform="rotate(120 -20 18)"/>
                <ellipse cx="-28" cy="0" rx="8" ry="20" transform="rotate(80 -28 0)"/>
                <ellipse cx="-20" cy="-18" rx="8" ry="20" transform="rotate(40 -20 -18)"/>
            </g>
            <circle cx="0" cy="0" r="13" fill="#5C3A1F"/>
        </g>
    </g>

    <text x="60" y="610" fill="#5C3A1F" font-family="-apple-system, sans-serif" font-size="14" opacity="0.85"
          letter-spacing="2">lingcoder.com
    </text>
</svg>
