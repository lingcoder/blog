    <!-- Petals on ground -->
    <g fill="#FFB0C8" opacity="0.9">
        <circle cx="200" cy="500" r="3"/>
        <circle cx="280" cy="530" r="2.5"/>
        <circle cx="350" cy="560" r="3"/>
        <circle cx="900" cy="510" r="3"/>
        <circle cx="1000" cy="540" r="2.5"/>
        <circle cx="1080" cy="565" r="3"/>
  </g>

    <text x="60" y="615" fill="#7C2030" font-family="-apple-system, sans-serif" font-size="14" opacity="0.85"
          letter-spacing="2">lingcoder.com
    </text>
</svg>
