<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#FFD8E8"/>
          <stop offset="1" stop-color="#FFF0E0"/>
    </linearGradient>
  </defs>

    <rect width="1200" height="450" fill="url(#sky)"/>

    <!-- Distant mountain -->
    <path d="M 0 380 L 200 280 L 320 320 L 480 250 L 640 310 L 800 270 L 960 320 L 1100 290 L 1200 320 L 1200 450 L 0 450 Z"
          fill="#A8B0D0" opacity="0.55"/>

    <!-- Cherry blossom petals floating -->
    <g fill="#FFB0C8" opacity="0.85">
        <circle cx="100" cy="80" r="3"/>
        <circle cx="220" cy="140" r="2.5"/>
        <circle cx="340" cy="100" r="3"/>
        <circle cx="460" cy="180" r="2.5"/>
        <circle cx="580" cy="120" r="3"/>
        <circle cx="700" cy="200" r="2.5"/>
        <circle cx="820" cy="140" r="3"/>
        <circle cx="940" cy="220" r="2.5"/>
        <circle cx="1060" cy="160" r="3"/>
        <circle cx="180" cy="240" r="2.5"/>
        <circle cx="400" cy="280" r="3"/>
        <circle cx="600" cy="260" r="2.5"/>
        <circle cx="800" cy="300" r="3"/>
        <circle cx="1000" cy="270" r="2.5"/>
  </g>

    <!-- Torii gate -->
    <g transform="translate(600,440)">
        <rect x="-90" y="-10" width="180" height="14" fill="#C03020"/>
        <rect x="-100" y="-30" width="200" height="14" fill="#C03020"/>
        <polygon points="-100,-30 -110,-30 -85,-40 -85,-30" fill="#A02818"/>
        <polygon points="100,-30 110,-30 85,-40 85,-30" fill="#A02818"/>
        <rect x="-78" y="-10" width="14" height="180" fill="#C03020"/>
        <rect x="64" y="-10" width="14" height="180" fill="#C03020"/>
        <rect x="-12" y="-30" width="24" height="14" fill="#5C2818"/>
    </g>

    <!-- Cherry trees -->
    <g transform="translate(220,440)">
        <rect x="-8" y="0" width="16" height="60" fill="#5C3820"/>
        <line x1="0" y1="0" x2="-30" y2="-30" stroke="#5C3820" stroke-width="6"/>
        <line x1="0" y1="0" x2="30" y2="-30" stroke="#5C3820" stroke-width="6"/>
        <line x1="0" y1="-15" x2="-15" y2="-50" stroke="#5C3820" stroke-width="5"/>
        <line x1="0" y1="-15" x2="15" y2="-50" stroke="#5C3820" stroke-width="5"/>
        <g fill="#FFB0C8">
            <circle cx="0" cy="-50" r="40"/>
            <circle cx="-30" cy="-30" r="32"/>
            <circle cx="30" cy="-35" r="35"/>
            <circle cx="-50" cy="-50" r="28"/>
            <circle cx="50" cy="-50" r="30"/>
            <circle cx="-15" cy="-75" r="30"/>
            <circle cx="20" cy="-80" r="32"/>
    </g>
        <g fill="#FFD0E0" opacity="0.85">
            <circle cx="-20" cy="-40" r="20"/>
            <circle cx="20" cy="-50" r="22"/>
            <circle cx="0" cy="-65" r="22"/>
    </g>
    </g>

    <g transform="translate(980,440)">
        <rect x="-8" y="0" width="16" height="55" fill="#5C3820"/>
        <line x1="0" y1="0" x2="-25" y2="-25" stroke="#5C3820" stroke-width="5"/>
        <line x1="0" y1="0" x2="25" y2="-25" stroke="#5C3820" stroke-width="5"/>
        <g fill="#FFB0C8">
            <circle cx="0" cy="-45" r="38"/>
            <circle cx="-26" cy="-25" r="28"/>
            <circle cx="28" cy="-30" r="32"/>
            <circle cx="-12" cy="-65" r="26"/>
            <circle cx="18" cy="-70" r="28"/>
    </g>
        <g fill="#FFD0E0" opacity="0.85">
            <circle cx="-15" cy="-38" r="18"/>
            <circle cx="18" cy="-48" r="20"/>
    </g>
    </g>

    <!-- Stone path/garden -->
    <path d="M 0 450 Q 600 430 1200 460 L 1200 540 L 0 540 Z" fill="#C8B098"/>
    <path d="M 0 540 Q 600 525 1200 550 L 1200 630 L 0 630 Z" fill="#A89070"/>

    <!-- Stones -->
    <g fill="#7C7060" opacity="0.7">
        <ellipse cx="500" cy="500" rx="20" ry="5"/>
        <ellipse cx="600" cy="510" rx="22" ry="5"/>
        <ellipse cx="700" cy="500" rx="20" ry="5"/>
        <ellipse cx="450" cy="540" rx="22" ry="6"/>
        <ellipse cx="600" cy="555" rx="24" ry="6"/>
        <ellipse cx="750" cy="540" rx="22" ry="6"/>
