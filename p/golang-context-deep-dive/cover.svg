            <stop offset="0" stop-color="#5C7A9E"/>
            <stop offset="1" stop-color="#C8D4E0"/>
        </linearGradient>
    </defs>

    <rect width="1200" height="380" fill="url(#sky)"/>

    <!-- Snow falling -->
    <g fill="#FFFFFF">
        <circle cx="80" cy="50" r="2" opacity="0.85"/>
        <circle cx="160" cy="120" r="2.5" opacity="0.9"/>
        <circle cx="240" cy="80" r="2" opacity="0.8"/>
        <circle cx="340" cy="150" r="2.5" opacity="0.9"/>
        <circle cx="420" cy="60" r="2" opacity="0.85"/>
        <circle cx="500" cy="130" r="2.5" opacity="0.9"/>
        <circle cx="580" cy="80" r="2" opacity="0.85"/>
        <circle cx="660" cy="160" r="2.5" opacity="0.9"/>
        <circle cx="740" cy="50" r="2" opacity="0.85"/>
        <circle cx="820" cy="140" r="2.5" opacity="0.9"/>
        <circle cx="900" cy="80" r="2" opacity="0.85"/>
        <circle cx="980" cy="150" r="2.5" opacity="0.9"/>
        <circle cx="1060" cy="60" r="2" opacity="0.85"/>
        <circle cx="1140" cy="130" r="2.5" opacity="0.9"/>
        <circle cx="120" cy="240" r="2" opacity="0.7"/>
        <circle cx="280" cy="290" r="2.5" opacity="0.75"/>
        <circle cx="450" cy="260" r="2" opacity="0.7"/>
        <circle cx="620" cy="300" r="2.5" opacity="0.75"/>
        <circle cx="800" cy="270" r="2" opacity="0.7"/>
        <circle cx="950" cy="290" r="2.5" opacity="0.75"/>
        <circle cx="1120" cy="270" r="2" opacity="0.7"/>
    </g>

    <!-- Distant pines (snow-laden) -->
    <g>
        <g transform="translate(80,400)">
            <polygon points="0,0 -20,-60 20,-60 0,-90 -16,-60 16,-60 0,-90" fill="#1F4028"/>
            <polygon points="0,0 -20,-60 20,-60" fill="#FFFFFF" opacity="0.7"/>
        </g>
        <g transform="translate(180,420)">
            <polygon points="0,0 -25,-70 25,-70 0,-105 -20,-70 20,-70 0,-105" fill="#1F4028"/>
            <polygon points="0,0 -25,-70 25,-70" fill="#FFFFFF" opacity="0.7"/>
        </g>
        <g transform="translate(290,400)">
            <polygon points="0,0 -22,-65 22,-65 0,-95 -18,-65 18,-65 0,-95" fill="#1F4028"/>
            <polygon points="0,0 -22,-65 22,-65" fill="#FFFFFF" opacity="0.7"/>
        </g>
        <g transform="translate(380,420)">
            <polygon points="0,0 -25,-70 25,-70 0,-105 -20,-70 20,-70 0,-105" fill="#1F4028"/>
            <polygon points="0,0 -25,-70 25,-70" fill="#FFFFFF" opacity="0.7"/>
        </g>
        <g transform="translate(820,420)">
            <polygon points="0,0 -25,-70 25,-70 0,-105 -20,-70 20,-70 0,-105" fill="#1F4028"/>
            <polygon points="0,0 -25,-70 25,-70" fill="#FFFFFF" opacity="0.7"/>
        </g>
        <g transform="translate(910,400)">
            <polygon points="0,0 -22,-65 22,-65 0,-95 -18,-65 18,-65 0,-95" fill="#1F4028"/>
            <polygon points="0,0 -22,-65 22,-65" fill="#FFFFFF" opacity="0.7"/>
        </g>
        <g transform="translate(1010,420)">
            <polygon points="0,0 -25,-70 25,-70 0,-105 -20,-70 20,-70 0,-105" fill="#1F4028"/>
            <polygon points="0,0 -25,-70 25,-70" fill="#FFFFFF" opacity="0.7"/>
        </g>
        <g transform="translate(1130,400)">
            <polygon points="0,0 -22,-65 22,-65 0,-95 -18,-65 18,-65 0,-95" fill="#1F4028"/>
            <polygon points="0,0 -22,-65 22,-65" fill="#FFFFFF" opacity="0.7"/>
        </g>
    </g>

    <!-- Snow ground -->
    <path d="M 0 380 Q 600 360 1200 390 L 1200 630 L 0 630 Z" fill="#F0F4F8"/>
    <path d="M 0 460 Q 600 440 1200 470 L 1200 630 L 0 630 Z" fill="#D8E0EE"/>

    <!-- Path through snow -->
    <path d="M 580 380 L 620 380 L 700 510 L 800 630 L 400 630 L 500 510 Z"
          fill="#A8B5CC" opacity="0.85"/>

    <!-- Footprints -->
    <g fill="#7C8AA0" opacity="0.85">
        <ellipse cx="555" cy="430" rx="6" ry="4"/>
        <ellipse cx="640" cy="445" rx="6" ry="4"/>
        <ellipse cx="540" cy="475" rx="6" ry="4"/>
        <ellipse cx="650" cy="490" rx="6" ry="4"/>
        <ellipse cx="525" cy="525" rx="6" ry="4"/>
        <ellipse cx="660" cy="540" rx="6" ry="4"/>
        <ellipse cx="510" cy="580" rx="6" ry="4"/>
        <ellipse cx="675" cy="595" rx="6" ry="4"/>
    </g>

    <!-- Foreground large tree -->
    <g transform="translate(150,510)">
        <polygon points="0,0 -55,-130 55,-130 0,-200 -45,-130 45,-130 0,-200" fill="#0F2818"/>
        <polygon points="0,0 -55,-130 55,-130" fill="#FFFFFF" opacity="0.65"/>
    </g>

    <text x="60" y="608" fill="#3A5070" font-family="-apple-system, sans-serif" font-size="14" opacity="0.85"
          letter-spacing="2">lingcoder.com
    </text>
</svg>
