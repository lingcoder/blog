<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
    <defs>
        <radialGradient id="canopy" cx="0.5" cy="0.5" r="0.65">
            <stop offset="0" stop-color="#FFD9E5"/>
            <stop offset="0.5" stop-color="#FF9CC0"/>
            <stop offset="1" stop-color="#C26890"/>
        </radialGradient>
    </defs>

    <!-- Background pink -->
    <rect width="1200" height="630" fill="url(#canopy)"/>

    <!-- Far perspective vanishing path -->
    <path d="M 540 380 L 660 380 L 720 630 L 480 630 Z" fill="#5C2D40" opacity="0.5"/>
    <path d="M 560 410 L 640 410 L 690 630 L 510 630 Z" fill="#7C3D58"/>

    <!-- Light at end of tunnel -->
    <ellipse cx="600" cy="380" rx="60" ry="20" fill="#FFFFFF" opacity="0.85"/>
    <ellipse cx="600" cy="380" rx="120" ry="40" fill="#FFFFFF" opacity="0.35"/>

    <!-- Trees on left forming tunnel -->
    <g>
        <ellipse cx="50" cy="350" rx="120" ry="100" fill="#FF9CC0"/>
        <ellipse cx="180" cy="360" rx="100" ry="90" fill="#FFB8D0"/>
        <ellipse cx="280" cy="370" rx="80" ry="75" fill="#FF9CC0"/>
        <ellipse cx="370" cy="375" rx="70" ry="60" fill="#FFC2D5"/>
        <ellipse cx="445" cy="380" rx="50" ry="45" fill="#FF9CC0"/>
        <ellipse cx="500" cy="388" rx="35" ry="28" fill="#FFD9E5"/>
    </g>

    <!-- Trees on right -->
    <g>
        <ellipse cx="1150" cy="350" rx="120" ry="100" fill="#FF9CC0"/>
        <ellipse cx="1020" cy="360" rx="100" ry="90" fill="#FFB8D0"/>
        <ellipse cx="920" cy="370" rx="80" ry="75" fill="#FF9CC0"/>
        <ellipse cx="830" cy="375" rx="70" ry="60" fill="#FFC2D5"/>
        <ellipse cx="755" cy="380" rx="50" ry="45" fill="#FF9CC0"/>
        <ellipse cx="700" cy="388" rx="35" ry="28" fill="#FFD9E5"/>
    </g>

    <!-- Trunks left side -->
    <g stroke="#5C3A40" stroke-width="6" fill="none">
        <line x1="50" y1="450" x2="48" y2="630"/>
        <line x1="180" y1="450" x2="178" y2="630"/>
        <line x1="280" y1="445" x2="278" y2="630"/>
        <line x1="370" y1="430" x2="368" y2="630"/>
        <line x1="445" y1="425" x2="443" y2="630"/>
    </g>

    <!-- Trunks right side -->
    <g stroke="#5C3A40" stroke-width="6" fill="none">
        <line x1="1150" y1="450" x2="1152" y2="630"/>
        <line x1="1020" y1="450" x2="1022" y2="630"/>
        <line x1="920" y1="445" x2="922" y2="630"/>
        <line x1="830" y1="430" x2="832" y2="630"/>
        <line x1="755" y1="425" x2="757" y2="630"/>
    </g>

    <!-- Falling petals -->
    <g fill="#FF7CA8">
        <circle cx="200" cy="180" r="3"/>
        <circle cx="320" cy="220" r="2.5"/>
        <circle cx="450" cy="140" r="3"/>
        <circle cx="600" cy="200" r="2.5"/>
        <circle cx="750" cy="160" r="3"/>
        <circle cx="870" cy="240" r="2.5"/>
        <circle cx="1000" cy="180" r="3"/>
        <circle cx="280" cy="320" r="2"/>
        <circle cx="540" cy="280" r="2.5"/>
        <circle cx="700" cy="320" r="2"/>
        <circle cx="960" cy="290" r="2.5"/>
        <circle cx="380" cy="450" r="2"/>
        <circle cx="800" cy="440" r="2.5"/>
    </g>

    <text x="60" y="610" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="14" opacity="0.85"
          letter-spacing="2">lingcoder.com
    </text>
</svg>
