<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#3D4A8A"/>
          <stop offset="0.45" stop-color="#A85A6E"/>
          <stop offset="1" stop-color="#FFB58A"/>
      </linearGradient>
      <linearGradient id="cliff" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#5C4030"/>
          <stop offset="1" stop-color="#2E1F18"/>
    </linearGradient>
  </defs>

    <rect width="1200" height="380" fill="url(#sky)"/>

    <!-- Soft clouds at sunset -->
    <g fill="#FFC890" opacity="0.5">
        <ellipse cx="200" cy="120" rx="120" ry="8"/>
        <ellipse cx="900" cy="100" rx="140" ry="9"/>
        <ellipse cx="1080" cy="180" rx="100" ry="7"/>
  </g>

    <!-- Sun -->
    <circle cx="200" cy="290" r="50" fill="#FFE5A0" opacity="0.92"/>
    <circle cx="200" cy="290" r="160" fill="#FFE5A0" opacity="0.18"/>

    <!-- Distant mountain range -->
    <path d="M 0 320 L 150 230 L 300 280 L 450 200 L 600 270 L 750 220 L 900 280 L 1050 200 L 1200 270 L 1200 380 L 0 380 Z"
          fill="#3D4A6E" opacity="0.7"/>

    <!-- Sea (right side) -->
    <rect x="600" y="380" width="600" height="100" fill="#3A4A6E"/>

    <!-- Cliff -->
    <path d="M 400 380 L 460 280 L 560 220 L 700 180 L 820 200 L 920 240 L 1020 280 L 1100 320 L 1200 350 L 1200 480 L 400 480 Z"
          fill="url(#cliff)"/>

    <!-- Castle on top -->
    <g transform="translate(700,180)">
        <!-- Main keep -->
        <rect x="-30" y="0" width="60" height="80" fill="#7C6850"/>
        <!-- Battlements main -->
        <rect x="-30" y="-8" width="10" height="8" fill="#7C6850"/>
        <rect x="-15" y="-8" width="10" height="8" fill="#7C6850"/>
        <rect x="0" y="-8" width="10" height="8" fill="#7C6850"/>
        <rect x="15" y="-8" width="10" height="8" fill="#7C6850"/>
        <!-- Side tower -->
        <rect x="-65" y="-15" width="30" height="95" fill="#5C4D38"/>
        <rect x="-65" y="-23" width="6" height="8" fill="#5C4D38"/>
        <rect x="-55" y="-23" width="6" height="8" fill="#5C4D38"/>
        <rect x="-45" y="-23" width="6" height="8" fill="#5C4D38"/>
        <!-- Tall tower -->
        <rect x="35" y="-35" width="22" height="115" fill="#5C4D38"/>
        <polygon points="35,-35 46,-60 57,-35" fill="#3A2D20"/>
        <!-- Flag -->
        <line x1="46" y1="-60" x2="46" y2="-78" stroke="#3A2D20" stroke-width="1.5"/>
        <polygon points="46,-78 56,-72 46,-66" fill="#D8401C"/>
        <!-- Windows lit -->
        <rect x="-23" y="20" width="6" height="10" fill="#FFD085"/>
        <rect x="-7" y="20" width="6" height="10" fill="#FFD085"/>
        <rect x="9" y="20" width="6" height="10" fill="#FFD085"/>
        <rect x="-58" y="20" width="5" height="8" fill="#FFD085"/>
        <rect x="-48" y="40" width="5" height="8" fill="#FFD085"/>
        <rect x="40" y="0" width="4" height="6" fill="#FFD085"/>
        <rect x="48" y="20" width="4" height="6" fill="#FFD085"/>
        <rect x="40" y="50" width="4" height="6" fill="#FFD085"/>
    </g>

    <!-- Cliff base waves -->
    <g fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1.5">
        <path d="M 700 460 q 30 -4 60 0 t 60 0"/>
        <path d="M 900 470 q 30 -4 60 0 t 60 0"/>
        <path d="M 800 510 q 30 -4 60 0 t 60 0"/>
  </g>

    <!-- Foreground sea -->
    <rect y="480" width="1200" height="150" fill="#1F2A4A"/>

    <text x="60" y="610" fill="#FFE5A0" font-family="-apple-system, sans-serif" font-size="14" opacity="0.85"
          letter-spacing="2">lingcoder.com
    </text>
</svg>
