<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
      <linearGradient id="nightSky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#0B1538"/>
          <stop offset="0.6" stop-color="#1B2A5C"/>
          <stop offset="1" stop-color="#3B4D8A"/>
    </linearGradient>
      <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0" stop-color="#F5E6C8" stop-opacity="0.5"/>
          <stop offset="1" stop-color="#F5E6C8" stop-opacity="0"/>
      </radialGradient>
  </defs>

    <!-- Night sky -->
    <rect width="1200" height="450" fill="url(#nightSky)"/>

    <!-- Stars -->
    <g fill="#F5E6C8">
        <circle cx="120" cy="80" r="1.5" opacity="0.9"/>
        <circle cx="220" cy="150" r="1" opacity="0.6"/>
        <circle cx="320" cy="60" r="1.8" opacity="0.95"/>
        <circle cx="440" cy="130" r="1.2" opacity="0.7"/>
        <circle cx="540" cy="80" r="1" opacity="0.5"/>
        <circle cx="680" cy="160" r="1.5" opacity="0.85"/>
        <circle cx="780" cy="50" r="1.3" opacity="0.8"/>
        <circle cx="880" cy="140" r="1.6" opacity="0.9"/>
        <circle cx="980" cy="90" r="1" opacity="0.55"/>
        <circle cx="1080" cy="170" r="1.4" opacity="0.75"/>
        <circle cx="1140" cy="60" r="1.1" opacity="0.65"/>
        <circle cx="60" cy="200" r="1" opacity="0.5"/>
        <circle cx="180" cy="250" r="0.9" opacity="0.45"/>
        <circle cx="380" cy="220" r="1.3" opacity="0.7"/>
        <circle cx="600" cy="240" r="0.8" opacity="0.4"/>
        <circle cx="820" cy="220" r="1" opacity="0.55"/>
        <circle cx="1020" cy="240" r="0.9" opacity="0.45"/>
    </g>

    <!-- Moon glow -->
    <circle cx="270" cy="170" r="160" fill="url(#moonGlow)"/>
    <!-- Moon -->
    <circle cx="270" cy="170" r="55" fill="#F5E6C8"/>
    <circle cx="290" cy="155" r="55" fill="#1B2A5C" opacity="0.4"/>

    <!-- Rolling hills -->
    <path d="M 0 380 Q 200 320 400 360 T 800 340 T 1200 360 L 1200 450 L 0 450 Z"
          fill="#1F2D5A"/>

    <!-- Lake -->
    <rect y="450" width="1200" height="180" fill="#0B1538"/>

    <!-- Moon reflection -->
    <ellipse cx="270" cy="475" rx="60" ry="4" fill="#F5E6C8" fill-opacity="0.4"/>
    <ellipse cx="270" cy="495" rx="48" ry="3" fill="#F5E6C8" fill-opacity="0.25"/>
    <ellipse cx="270" cy="515" rx="36" ry="2" fill="#F5E6C8" fill-opacity="0.15"/>

    <!-- Tree silhouettes on lake bank -->
    <g fill="#0B1538">
        <ellipse cx="900" cy="430" rx="20" ry="40"/>
        <ellipse cx="940" cy="440" rx="25" ry="35"/>
        <ellipse cx="980" cy="430" rx="22" ry="42"/>
        <ellipse cx="1020" cy="445" rx="18" ry="32"/>
        <ellipse cx="1060" cy="435" rx="24" ry="38"/>
        <rect x="898" y="435" width="4" height="15"/>
        <rect x="938" y="445" width="4" height="15"/>
        <rect x="978" y="435" width="4" height="15"/>
        <rect x="1018" y="450" width="4" height="15"/>
        <rect x="1058" y="440" width="4" height="15"/>
  </g>

    <!-- Footer -->
    <text x="60" y="600" fill="#F5E6C8" font-family="-apple-system, sans-serif" font-size="14" opacity="0.7"
          letter-spacing="2">lingcoder.com
    </text>
</svg>
