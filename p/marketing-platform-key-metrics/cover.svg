<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#FFD8C0"/>
          <stop offset="0.5" stop-color="#FFB8A8"/>
          <stop offset="1" stop-color="#FFE0C0"/>
      </linearGradient>
      <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#A8C8D8"/>
          <stop offset="1" stop-color="#5C8AA8"/>
      </linearGradient>
      <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#F5DCA8"/>
          <stop offset="1" stop-color="#D8B888"/>
    </linearGradient>
  </defs>

    <rect width="1200" height="280" fill="url(#sky)"/>

    <!-- Sun rising on horizon -->
    <circle cx="700" cy="270" r="50" fill="#FFEDB5" opacity="0.95"/>
    <circle cx="700" cy="270" r="160" fill="#FFEDB5" opacity="0.2"/>

    <!-- Wisp clouds -->
    <g fill="#FFD0B0" opacity="0.7">
        <ellipse cx="200" cy="80" rx="120" ry="6"/>
        <ellipse cx="500" cy="120" rx="100" ry="5"/>
        <ellipse cx="950" cy="60" rx="140" ry="7"/>
        <ellipse cx="1080" cy="160" rx="100" ry="5"/>
    </g>

    <!-- Distant land -->
    <path d="M 0 280 L 100 260 L 200 270 L 0 270 Z" fill="#7C8AA0" opacity="0.5"/>

    <!-- Sea -->
    <rect y="280" width="1200" height="150" fill="url(#sea)"/>

    <!-- Sun reflection -->
    <g fill="#FFEDB5" opacity="0.55">
        <ellipse cx="700" cy="295" rx="60" ry="3"/>
        <ellipse cx="700" cy="315" rx="48" ry="2.5"/>
        <ellipse cx="700" cy="335" rx="38" ry="2"/>
        <ellipse cx="700" cy="355" rx="28" ry="1.5"/>
    </g>

    <!-- Subtle waves -->
    <g fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1.5">
        <path d="M 100 320 q 30 -4 60 0 t 60 0"/>
        <path d="M 900 330 q 30 -4 60 0 t 60 0"/>
        <path d="M 250 360 q 50 -5 100 0 t 100 0"/>
        <path d="M 800 380 q 50 -5 100 0 t 100 0"/>
    </g>

    <!-- Wave at shore line -->
    <path d="M 0 430 Q 200 410 400 425 Q 600 440 800 415 Q 1000 395 1200 425 L 1200 440 L 0 440 Z"
          fill="#FFFFFF" opacity="0.85"/>
    <path d="M 0 440 Q 300 425 600 440 Q 900 455 1200 435 L 1200 470 L 0 470 Z"
          fill="#E0F0F0" opacity="0.7"/>

    <!-- Sand -->
    <rect y="470" width="1200" height="160" fill="url(#sand)"/>

    <!-- Seashells / starfish -->
    <g>
        <!-- starfish -->
        <g transform="translate(300,565)" fill="#E89B5C">
            <polygon points="0,-15 4,-5 14,-5 6,3 9,13 0,7 -9,13 -6,3 -14,-5 -4,-5"/>
        </g>
        <!-- seashell -->
        <g transform="translate(700,580)" fill="#F0CFA8">
            <path d="M 0 0 Q -15 -5 -18 -15 Q -10 -20 0 -18 Q 10 -20 18 -15 Q 15 -5 0 0 Z"/>
            <line x1="0" y1="0" x2="-12" y2="-12" stroke="#A8826E" stroke-width="1"/>
            <line x1="0" y1="0" x2="0" y2="-16" stroke="#A8826E" stroke-width="1"/>
            <line x1="0" y1="0" x2="12" y2="-12" stroke="#A8826E" stroke-width="1"/>
        </g>
        <!-- shell 2 -->
        <g transform="translate(950,600)" fill="#D8A878">
            <ellipse cx="0" cy="0" rx="14" ry="8"/>
            <line x1="-10" y1="-3" x2="10" y2="-3" stroke="#A8826E" stroke-width="1"/>
        </g>
    </g>

    <!-- Footprints -->
    <g fill="#A8826E" opacity="0.6">
        <ellipse cx="100" cy="540" rx="6" ry="4"/>
        <ellipse cx="120" cy="555" rx="6" ry="4"/>
        <ellipse cx="140" cy="540" rx="6" ry="4"/>
        <ellipse cx="160" cy="555" rx="6" ry="4"/>
        <ellipse cx="180" cy="540" rx="6" ry="4"/>
        <ellipse cx="200" cy="555" rx="6" ry="4"/>
        <ellipse cx="220" cy="540" rx="6" ry="4"/>
  </g>

    <!-- Birds -->
    <g fill="none" stroke="#7C6E5C" stroke-width="2" stroke-linecap="round">
        <path d="M 350 150 q 6 -8 12 0 q 6 -8 12 0"/>
        <path d="M 850 130 q 5 -7 10 0 q 5 -7 10 0"/>
    </g>

    <text x="60" y="610" fill="#7C6E5C" font-family="-apple-system, sans-serif" font-size="14" opacity="0.85"
          letter-spacing="2">lingcoder.com
    </text>
</svg>
