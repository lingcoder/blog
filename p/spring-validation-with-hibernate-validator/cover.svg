<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#FFE085"/>
          <stop offset="0.5" stop-color="#FFB562"/>
          <stop offset="1" stop-color="#E89B5C"/>
      </linearGradient>
      <linearGradient id="wheatBack" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#F0C865"/>
          <stop offset="1" stop-color="#C99540"/>
      </linearGradient>
      <linearGradient id="wheatFront" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#D4A04C"/>
          <stop offset="1" stop-color="#8C6320"/>
    </linearGradient>
  </defs>

    <rect width="1200" height="380" fill="url(#sky)"/>

    <!-- Sun -->
    <circle cx="850" cy="220" r="65" fill="#FFE3A0" opacity="0.95"/>
    <circle cx="850" cy="220" r="180" fill="#FFE3A0" opacity="0.15"/>

    <!-- Distant tree row -->
    <g fill="#5C4A28" opacity="0.55">
        <ellipse cx="80" cy="350" rx="40" ry="22"/>
        <ellipse cx="180" cy="345" rx="55" ry="28"/>
        <ellipse cx="290" cy="350" rx="50" ry="24"/>
        <ellipse cx="430" cy="348" rx="60" ry="26"/>
        <ellipse cx="600" cy="345" rx="55" ry="25"/>
        <ellipse cx="750" cy="350" rx="50" ry="24"/>
        <ellipse cx="920" cy="346" rx="65" ry="28"/>
        <ellipse cx="1080" cy="350" rx="55" ry="24"/>
    </g>

    <!-- Wheat field back -->
    <rect y="380" width="1200" height="120" fill="url(#wheatBack)"/>
    <!-- Wheat strokes back -->
    <g stroke="#A8782A" stroke-width="1" opacity="0.5">
        <line x1="40" y1="385" x2="40" y2="500"/>
        <line x1="80" y1="385" x2="80" y2="500"/>
        <line x1="120" y1="385" x2="120" y2="500"/>
        <line x1="160" y1="385" x2="160" y2="500"/>
        <line x1="220" y1="385" x2="220" y2="500"/>
        <line x1="280" y1="385" x2="280" y2="500"/>
        <line x1="340" y1="385" x2="340" y2="500"/>
        <line x1="420" y1="385" x2="420" y2="500"/>
        <line x1="500" y1="385" x2="500" y2="500"/>
        <line x1="580" y1="385" x2="580" y2="500"/>
        <line x1="660" y1="385" x2="660" y2="500"/>
        <line x1="740" y1="385" x2="740" y2="500"/>
        <line x1="820" y1="385" x2="820" y2="500"/>
        <line x1="900" y1="385" x2="900" y2="500"/>
        <line x1="980" y1="385" x2="980" y2="500"/>
        <line x1="1060" y1="385" x2="1060" y2="500"/>
        <line x1="1140" y1="385" x2="1140" y2="500"/>
    </g>

    <!-- Wheat field front -->
    <rect y="500" width="1200" height="130" fill="url(#wheatFront)"/>
    <!-- Wheat heads (more detail in front) -->
    <g fill="#5C4218">
        <g transform="translate(50,520)">
            <line x1="0" y1="0" x2="0" y2="50" stroke="#5C4218" stroke-width="2"/>
            <ellipse cx="0" cy="-2" rx="3" ry="6"/>
    </g>
        <g transform="translate(150,520)">
            <line x1="0" y1="0" x2="0" y2="50" stroke="#5C4218" stroke-width="2"/>
            <ellipse cx="0" cy="-2" rx="3" ry="6"/>
    </g>
        <g transform="translate(280,520)">
            <line x1="0" y1="0" x2="0" y2="50" stroke="#5C4218" stroke-width="2"/>
            <ellipse cx="0" cy="-2" rx="3" ry="6"/>
    </g>
        <g transform="translate(420,520)">
            <line x1="0" y1="0" x2="0" y2="50" stroke="#5C4218" stroke-width="2"/>
            <ellipse cx="0" cy="-2" rx="3" ry="6"/>
        </g>
        <g transform="translate(580,520)">
            <line x1="0" y1="0" x2="0" y2="50" stroke="#5C4218" stroke-width="2"/>
            <ellipse cx="0" cy="-2" rx="3" ry="6"/>
        </g>
        <g transform="translate(740,520)">
            <line x1="0" y1="0" x2="0" y2="50" stroke="#5C4218" stroke-width="2"/>
            <ellipse cx="0" cy="-2" rx="3" ry="6"/>
        </g>
        <g transform="translate(900,520)">
            <line x1="0" y1="0" x2="0" y2="50" stroke="#5C4218" stroke-width="2"/>
            <ellipse cx="0" cy="-2" rx="3" ry="6"/>
        </g>
        <g transform="translate(1080,520)">
            <line x1="0" y1="0" x2="0" y2="50" stroke="#5C4218" stroke-width="2"/>
            <ellipse cx="0" cy="-2" rx="3" ry="6"/>
    </g>
  </g>

    <text x="60" y="610" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="14" opacity="0.85"
          letter-spacing="2">lingcoder.com
    </text>
</svg>
