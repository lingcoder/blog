<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
    <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#0F1A38"/>
            <stop offset="1" stop-color="#3A4A78"/>
        </linearGradient>
    </defs>

    <rect width="1200" height="450" fill="url(#sky)"/>

    <!-- Moon -->
    <circle cx="950" cy="140" r="42" fill="#F0E8C0"/>
    <circle cx="935" cy="130" r="40" fill="#0F1A38"/>

    <!-- Stars -->
    <g fill="#FFFFFF">
        <circle cx="80" cy="60" r="1.2" opacity="0.85"/>
        <circle cx="180" cy="100" r="1" opacity="0.7"/>
        <circle cx="280" cy="50" r="1.4" opacity="0.85"/>
        <circle cx="400" cy="120" r="1" opacity="0.65"/>
        <circle cx="520" cy="70" r="1.3" opacity="0.8"/>
        <circle cx="660" cy="90" r="1" opacity="0.7"/>
        <circle cx="780" cy="50" r="1.2" opacity="0.8"/>
        <circle cx="1100" cy="100" r="1.3" opacity="0.85"/>
        <circle cx="60" cy="180" r="1" opacity="0.6"/>
        <circle cx="350" cy="200" r="1.2" opacity="0.7"/>
        <circle cx="700" cy="220" r="1" opacity="0.6"/>
        <circle cx="1050" cy="200" r="1.2" opacity="0.7"/>
    </g>

    <!-- Falling snow -->
    <g fill="#FFFFFF" opacity="0.85">
        <circle cx="120" cy="280" r="2"/>
        <circle cx="280" cy="320" r="2.2"/>
        <circle cx="450" cy="290" r="1.8"/>
        <circle cx="620" cy="340" r="2"/>
        <circle cx="780" cy="300" r="2.2"/>
        <circle cx="900" cy="350" r="1.8"/>
        <circle cx="1080" cy="320" r="2"/>
        <circle cx="200" cy="380" r="2"/>
        <circle cx="540" cy="400" r="2.2"/>
        <circle cx="850" cy="410" r="1.8"/>
    </g>

    <!-- Distant snow mountains -->
    <path d="M 0 380 L 200 250 L 320 290 L 480 230 L 620 280 L 780 220 L 920 270 L 1080 240 L 1200 290 L 1200 450 L 0 450 Z"
          fill="#5A6890" opacity="0.7"/>
    <path d="M 0 420 L 180 300 L 280 340 L 440 280 L 580 330 L 720 270 L 860 320 L 1020 290 L 1200 330 L 1200 450 L 0 450 Z"
          fill="#3A4868" opacity="0.85"/>

    <!-- Snow ground -->
    <path d="M 0 450 Q 600 430 1200 460 L 1200 630 L 0 630 Z" fill="#E8EEF6"/>
    <path d="M 0 530 Q 600 510 1200 540 L 1200 630 L 0 630 Z" fill="#C8D2E0"/>

    <!-- Church silhouette -->
    <g transform="translate(580,360)">
        <rect x="-50" y="20" width="100" height="80" fill="#1A2438"/>
        <polygon points="-50,20 0,-30 50,20" fill="#1A2438"/>
        <rect x="-10" y="-90" width="20" height="60" fill="#1A2438"/>
        <polygon points="-15,-90 0,-115 15,-90" fill="#1A2438"/>
        <rect x="-22" y="-72" width="6" height="6" fill="#FFD680" opacity="0.8"/>
        <rect x="-30" y="50" width="14" height="20" fill="#FFD680" opacity="0.85"/>
        <rect x="16" y="50" width="14" height="20" fill="#FFD680" opacity="0.85"/>
        <rect x="-7" y="40" width="14" height="20" fill="#FFD680" opacity="0.85"/>
    </g>

    <!-- Houses -->
    <g transform="translate(280,440)">
        <rect x="-30" y="0" width="60" height="40" fill="#1F2C42"/>
        <polygon points="-35,0 0,-25 35,0" fill="#0F1A30"/>
        <rect x="-12" y="12" width="14" height="18" fill="#FFD680" opacity="0.8"/>
        <rect x="10" y="12" width="10" height="14" fill="#FFD680" opacity="0.7"/>
        <polygon points="-35,0 35,0 30,-3 -30,-3" fill="#FFFFFF" opacity="0.9"/>
    </g>
    <g transform="translate(820,450)">
        <rect x="-26" y="0" width="52" height="35" fill="#1F2C42"/>
        <polygon points="-30,0 0,-22 30,0" fill="#0F1A30"/>
        <rect x="-8" y="10" width="12" height="16" fill="#FFD680" opacity="0.85"/>
        <polygon points="-30,0 30,0 25,-3 -25,-3" fill="#FFFFFF" opacity="0.9"/>
    </g>
    <g transform="translate(950,455)">
        <rect x="-22" y="0" width="44" height="32" fill="#1F2C42"/>
        <polygon points="-26,0 0,-20 26,0" fill="#0F1A30"/>
        <rect x="-7" y="10" width="10" height="14" fill="#FFD680" opacity="0.7"/>
        <polygon points="-26,0 26,0 22,-3 -22,-3" fill="#FFFFFF" opacity="0.9"/>
    </g>

    <!-- Pines -->
    <g fill="#0A1426">
        <g transform="translate(120,500)">
            <polygon points="0,0 -22,-50 22,-50 0,-80 -18,-50 18,-50 0,-80"/>
            <polygon points="0,0 -22,-50 22,-50" fill="#FFFFFF" opacity="0.55"/>
        </g>
        <g transform="translate(200,510)">
            <polygon points="0,0 -18,-42 18,-42 0,-65 -15,-42 15,-42 0,-65"/>
            <polygon points="0,0 -18,-42 18,-42" fill="#FFFFFF" opacity="0.5"/>
        </g>
        <g transform="translate(1080,500)">
            <polygon points="0,0 -22,-55 22,-55 0,-85 -18,-55 18,-55 0,-85"/>
            <polygon points="0,0 -22,-55 22,-55" fill="#FFFFFF" opacity="0.55"/>
        </g>
    </g>

    <text x="60" y="610" fill="#A8B5CC" font-family="-apple-system, sans-serif" font-size="14" opacity="0.85"
          letter-spacing="2">lingcoder.com
    </text>
</svg>
