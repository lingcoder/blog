<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
    <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#0A0A20"/>
            <stop offset="1" stop-color="#1F2858"/>
        </linearGradient>
        <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#1F3878"/>
            <stop offset="1" stop-color="#082040"/>
        </linearGradient>
        <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#5CFFCB" stop-opacity="0.6"/>
            <stop offset="1" stop-color="#5CFFCB" stop-opacity="0"/>
        </radialGradient>
    </defs>

    <rect width="1200" height="350" fill="url(#sky)"/>

    <!-- Stars -->
    <g fill="#FFFFFF">
        <circle cx="80" cy="60" r="1.4" opacity="0.9"/>
        <circle cx="200" cy="100" r="1" opacity="0.65"/>
        <circle cx="320" cy="50" r="1.5" opacity="0.95"/>
        <circle cx="450" cy="120" r="1.2" opacity="0.8"/>
        <circle cx="580" cy="70" r="1.3" opacity="0.85"/>
        <circle cx="700" cy="100" r="1" opacity="0.7"/>
        <circle cx="820" cy="50" r="1.2" opacity="0.8"/>
        <circle cx="940" cy="110" r="1.3" opacity="0.85"/>
        <circle cx="1080" cy="60" r="1.4" opacity="0.9"/>
        <circle cx="120" cy="180" r="1" opacity="0.6"/>
        <circle cx="380" cy="200" r="1.2" opacity="0.7"/>
        <circle cx="650" cy="180" r="1" opacity="0.65"/>
        <circle cx="900" cy="220" r="1.2" opacity="0.7"/>
        <circle cx="1140" cy="200" r="1" opacity="0.6"/>
    </g>

    <!-- Moon -->
    <circle cx="280" cy="160" r="35" fill="#F0E8C8" opacity="0.95"/>
    <circle cx="280" cy="160" r="80" fill="#F0E8C8" opacity="0.18"/>

    <!-- Distant cliff -->
    <path d="M 0 350 L 100 280 L 200 320 L 320 270 L 440 320 L 0 320 Z" fill="#0A1430" opacity="0.85"/>
    <path d="M 850 350 L 950 290 L 1050 320 L 1150 280 L 1200 320 L 1200 350 Z" fill="#0A1430" opacity="0.85"/>

    <!-- Sea -->
    <rect y="350" width="1200" height="280" fill="url(#sea)"/>

    <!-- Bioluminescence glow patches -->
    <ellipse cx="300" cy="450" rx="180" ry="40" fill="url(#glow)"/>
    <ellipse cx="700" cy="500" rx="220" ry="50" fill="url(#glow)"/>
    <ellipse cx="1000" cy="450" rx="160" ry="35" fill="url(#glow)"/>

    <!-- Glowing wave caps -->
    <g fill="none" stroke="#5CFFCB" stroke-opacity="0.85" stroke-width="2">
        <path d="M 200 440 q 30 -5 60 0 t 60 0 t 60 0"/>
        <path d="M 600 490 q 40 -6 80 0 t 80 0 t 80 0"/>
        <path d="M 950 450 q 30 -5 60 0 t 60 0"/>
        <path d="M 100 510 q 50 -6 100 0 t 100 0"/>
        <path d="M 800 540 q 50 -6 100 0 t 100 0"/>
    </g>
    <g fill="none" stroke="#5CFFCB" stroke-opacity="0.45" stroke-width="1.2">
        <path d="M 100 470 q 20 -3 40 0 t 40 0 t 40 0 t 40 0"/>
        <path d="M 500 525 q 30 -4 60 0 t 60 0 t 60 0"/>
        <path d="M 900 510 q 25 -3 50 0 t 50 0 t 50 0"/>
        <path d="M 200 580 q 40 -5 80 0 t 80 0 t 80 0"/>
        <path d="M 700 600 q 40 -5 80 0 t 80 0 t 80 0"/>
    </g>

    <!-- Glowing dots scattered -->
    <g fill="#5CFFCB">
        <circle cx="220" cy="445" r="2.2" opacity="0.85"/>
        <circle cx="280" cy="460" r="1.8" opacity="0.75"/>
        <circle cx="340" cy="450" r="2" opacity="0.8"/>
        <circle cx="400" cy="475" r="1.5" opacity="0.65"/>
        <circle cx="650" cy="500" r="2.2" opacity="0.85"/>
        <circle cx="720" cy="490" r="2" opacity="0.8"/>
        <circle cx="780" cy="510" r="1.8" opacity="0.75"/>
        <circle cx="950" cy="455" r="2" opacity="0.8"/>
        <circle cx="1010" cy="445" r="1.8" opacity="0.75"/>
        <circle cx="1070" cy="465" r="2.2" opacity="0.85"/>
    </g>

    <!-- Beach foreground -->
    <path d="M 0 600 Q 600 580 1200 605 L 1200 630 L 0 630 Z" fill="#1F2030"/>

    <!-- Reflections of stars in water (faint) -->
    <g fill="#FFFFFF" opacity="0.4">
        <circle cx="280" cy="380" r="1"/>
        <circle cx="700" cy="395" r="1.2"/>
        <circle cx="950" cy="380" r="1"/>
    </g>

    <text x="60" y="615" fill="#5CFFCB" font-family="-apple-system, sans-serif" font-size="14" opacity="0.85"
          letter-spacing="2">lingcoder.com
    </text>
</svg>
