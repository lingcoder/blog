<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
    <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#7CB8D8"/>
            <stop offset="1" stop-color="#E0EAF0"/>
        </linearGradient>
        <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#5C8AA8"/>
            <stop offset="1" stop-color="#2E5070"/>
        </linearGradient>
    </defs>

    <rect width="1200" height="320" fill="url(#sky)"/>

    <!-- Big puffy clouds -->
    <g fill="#FFFFFF" opacity="0.95">
        <ellipse cx="180" cy="120" rx="100" ry="38"/>
        <ellipse cx="220" cy="100" rx="80" ry="32"/>
        <ellipse cx="260" cy="115" rx="70" ry="30"/>
        <ellipse cx="140" cy="135" rx="60" ry="26"/>

        <ellipse cx="700" cy="80" rx="120" ry="40"/>
        <ellipse cx="740" cy="60" rx="90" ry="35"/>
        <ellipse cx="660" cy="95" rx="75" ry="28"/>

        <ellipse cx="1000" cy="160" rx="100" ry="35"/>
        <ellipse cx="1050" cy="140" rx="70" ry="28"/>
        <ellipse cx="960" cy="175" rx="60" ry="22"/>
    </g>

    <!-- Sun -->
    <circle cx="500" cy="180" r="50" fill="#FFE5B0"/>

    <!-- Sea -->
    <rect y="320" width="1200" height="310" fill="url(#sea)"/>

    <!-- Distant island -->
    <path d="M 50 340 Q 130 320 180 330 Q 230 320 280 340 Z" fill="#5C788C" opacity="0.7"/>

    <!-- Wave whitecaps -->
    <g fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1.5">
        <path d="M 100 410 q 30 -5 60 0 t 60 0"/>
        <path d="M 350 430 q 30 -5 60 0 t 60 0"/>
        <path d="M 600 415 q 30 -5 60 0 t 60 0"/>
        <path d="M 850 440 q 30 -5 60 0 t 60 0"/>
        <path d="M 200 480 q 50 -7 100 0 t 100 0"/>
        <path d="M 700 490 q 50 -7 100 0 t 100 0"/>
        <path d="M 100 550 q 60 -8 120 0 t 120 0"/>
        <path d="M 800 560 q 60 -8 120 0 t 120 0"/>
    </g>

    <!-- Sailboat -->
    <g transform="translate(700,440)">
        <!-- Hull -->
        <polygon points="-40,0 40,0 32,18 -32,18" fill="#3A2D2A"/>
        <!-- Mast -->
        <line x1="0" y1="0" x2="0" y2="-90" stroke="#3A2D2A" stroke-width="3"/>
        <!-- Main sail -->
        <polygon points="0,-90 0,-10 60,-10" fill="#FFFFFF"/>
        <!-- Jib -->
        <polygon points="0,-90 -40,-10 -3,-10" fill="#FFFFFF"/>
        <!-- Wave around boat -->
        <path d="M -55 18 q 20 -4 40 0 t 40 0 t 40 0" stroke="#FFFFFF" stroke-width="1.5" fill="none" opacity="0.7"/>
    </g>

    <!-- Smaller sailboat -->
    <g transform="translate(950,500)">
        <polygon points="-25,0 25,0 20,12 -20,12" fill="#3A2D2A"/>
        <line x1="0" y1="0" x2="0" y2="-55" stroke="#3A2D2A" stroke-width="2"/>
        <polygon points="0,-55 0,-5 35,-5" fill="#FFFFFF"/>
    </g>

    <!-- Birds -->
    <g fill="none" stroke="#3A4A6E" stroke-width="2" stroke-linecap="round">
        <path d="M 380 200 q 6 -8 12 0 q 6 -8 12 0"/>
        <path d="M 440 230 q 5 -7 10 0 q 5 -7 10 0"/>
        <path d="M 850 220 q 6 -8 12 0 q 6 -8 12 0"/>
    </g>

    <text x="60" y="610" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="14" opacity="0.85"
          letter-spacing="2">lingcoder.com
    </text>
</svg>
