<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
    <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#1F1438"/>
            <stop offset="0.6" stop-color="#5C2050"/>
            <stop offset="1" stop-color="#A03060"/>
        </linearGradient>
    </defs>

    <rect width="1200" height="630" fill="url(#sky)"/>

    <!-- Stars -->
    <g fill="#FFFFFF">
        <circle cx="80" cy="60" r="1.4" opacity="0.9"/>
        <circle cx="200" cy="100" r="1.2" opacity="0.8"/>
        <circle cx="340" cy="50" r="1.5" opacity="0.95"/>
        <circle cx="480" cy="120" r="1" opacity="0.65"/>
        <circle cx="620" cy="70" r="1.3" opacity="0.85"/>
        <circle cx="760" cy="100" r="1.2" opacity="0.8"/>
        <circle cx="900" cy="60" r="1.4" opacity="0.9"/>
        <circle cx="1050" cy="110" r="1.2" opacity="0.8"/>
        <circle cx="1150" cy="50" r="1.3" opacity="0.85"/>
        <circle cx="120" cy="180" r="1" opacity="0.6"/>
        <circle cx="280" cy="200" r="1.2" opacity="0.7"/>
        <circle cx="440" cy="180" r="1" opacity="0.65"/>
        <circle cx="700" cy="200" r="1.3" opacity="0.8"/>
        <circle cx="980" cy="180" r="1" opacity="0.6"/>
        <circle cx="1100" cy="220" r="1.2" opacity="0.7"/>
    </g>

    <!-- Crescent moon -->
    <g transform="translate(320,180)">
        <circle r="40" fill="#FFE5A0"/>
        <circle cx="14" cy="-6" r="38" fill="#1F1438"/>
    </g>
    <circle cx="320" cy="180" r="80" fill="#FFE5A0" opacity="0.12"/>

    <!-- Distant dunes (silhouettes) -->
    <path d="M 0 420 Q 200 380 400 410 Q 600 380 800 420 Q 1000 390 1200 410 L 1200 480 L 0 480 Z" fill="#3D1F40"
          opacity="0.85"/>

    <!-- Mid dunes -->
    <path d="M 0 480 Q 250 440 500 470 Q 750 440 1000 480 Q 1100 470 1200 470 L 1200 540 L 0 540 Z" fill="#5C2845"/>

    <!-- Near dunes -->
    <path d="M 0 540 Q 300 510 600 530 Q 900 510 1200 540 L 1200 630 L 0 630 Z" fill="#7C3050"/>
    <path d="M 0 590 Q 400 570 800 590 Q 1000 580 1200 600 L 1200 630 L 0 630 Z" fill="#A03868"/>

    <!-- Dune ridge highlights -->
    <g fill="none" stroke="#C04880" stroke-width="1.5" opacity="0.45">
        <path d="M 0 540 Q 300 510 600 530 Q 900 510 1200 540"/>
        <path d="M 0 480 Q 250 440 500 470 Q 750 440 1000 480 Q 1100 470 1200 470"/>
    </g>

    <!-- Camel caravan silhouette -->
    <g fill="#1F0A20">
        <g transform="translate(700,560)">
            <path d="M 0 0 L 0 -22 L 5 -25 L 8 -22 L 14 -22 L 16 -28 L 22 -28 L 22 -22 L 28 -22 L 28 0 L 25 0 L 24 -8 L 4 -8 L 3 0 Z"/>
            <line x1="3" y1="0" x2="3" y2="6" stroke="#1F0A20" stroke-width="2"/>
            <line x1="25" y1="0" x2="25" y2="6" stroke="#1F0A20" stroke-width="2"/>
        </g>
        <g transform="translate(750,562)">
            <path d="M 0 0 L 0 -20 L 5 -23 L 8 -20 L 14 -20 L 16 -26 L 22 -26 L 22 -20 L 26 -20 L 26 0 L 23 0 L 22 -7 L 4 -7 L 3 0 Z"/>
        </g>
    </g>

    <!-- Cactus silhouette small -->
    <g fill="#1F0A20" transform="translate(150,580)">
        <path d="M 0 0 L 0 -30 Q 0 -34 4 -34 Q 8 -34 8 -30 L 8 -18 L 14 -18 L 14 -25 Q 14 -28 18 -28 Q 22 -28 22 -25 L 22 0 Z"/>
    </g>

    <text x="60" y="612" fill="#FFC0D0" font-family="-apple-system, sans-serif" font-size="14" opacity="0.8"
          letter-spacing="2">lingcoder.com
    </text>
</svg>
