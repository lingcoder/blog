<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
    <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#0D1A38"/>
            <stop offset="0.6" stop-color="#23355C"/>
            <stop offset="1" stop-color="#3D4F7E"/>
        </linearGradient>
        <radialGradient id="moonHalo" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#E5E5E0" stop-opacity="0.4"/>
            <stop offset="1" stop-color="#E5E5E0" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="windowGlow" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#FFD085" stop-opacity="0.85"/>
            <stop offset="1" stop-color="#FFD085" stop-opacity="0"/>
        </radialGradient>
    </defs>

    <rect width="1200" height="630" fill="url(#sky)"/>

    <!-- Stars -->
    <g fill="#FFFFFF">
        <circle cx="100" cy="80" r="1.4" opacity="0.9"/>
        <circle cx="240" cy="120" r="1" opacity="0.6"/>
        <circle cx="380" cy="60" r="1.6" opacity="0.95"/>
        <circle cx="520" cy="140" r="1.2" opacity="0.7"/>
        <circle cx="660" cy="80" r="1" opacity="0.55"/>
        <circle cx="800" cy="160" r="1.4" opacity="0.85"/>
        <circle cx="940" cy="50" r="1.3" opacity="0.8"/>
        <circle cx="1080" cy="120" r="1.5" opacity="0.9"/>
        <circle cx="1140" cy="220" r="1" opacity="0.5"/>
        <circle cx="60" cy="200" r="0.9" opacity="0.5"/>
    </g>

    <!-- Moon -->
    <circle cx="980" cy="180" r="120" fill="url(#moonHalo)"/>
    <circle cx="980" cy="180" r="42" fill="#E5E5E0"/>

    <!-- Snow mountain background -->
    <path d="M 0 380 L 200 250 L 360 320 L 540 230 L 720 310 L 900 250 L 1080 310 L 1200 280 L 1200 460 L 0 460 Z"
          fill="#5A6E96" opacity="0.85"/>
    <!-- Snow caps -->
    <g fill="#FFFFFF" opacity="0.85">
        <path d="M 540 230 L 590 290 L 490 290 Z"/>
        <path d="M 720 310 L 770 360 L 670 360 Z"/>
        <path d="M 900 250 L 950 310 L 850 310 Z"/>
        <path d="M 200 250 L 250 310 L 150 310 Z"/>
    </g>

    <!-- Snow ground -->
    <path d="M 0 460 Q 600 430 1200 470 L 1200 630 L 0 630 Z" fill="#D8E0EE"/>
    <path d="M 0 510 Q 600 485 1200 515 L 1200 630 L 0 630 Z" fill="#A8B3CC"/>

    <!-- Cabin -->
    <g transform="translate(420,460)">
        <!-- Body -->
        <rect x="0" y="0" width="160" height="80" fill="#4A2D1F"/>
        <!-- Roof -->
        <polygon points="-15,0 80,-50 175,0" fill="#FFFFFF"/>
        <polygon points="-15,5 80,-44 175,5" fill="#3A1F14"/>
        <!-- Window glow -->
        <circle cx="80" cy="40" r="50" fill="url(#windowGlow)"/>
        <rect x="60" y="20" width="40" height="35" fill="#FFD085"/>
        <line x1="80" y1="20" x2="80" y2="55" stroke="#4A2D1F" stroke-width="2"/>
        <line x1="60" y1="38" x2="100" y2="38" stroke="#4A2D1F" stroke-width="2"/>
        <!-- Door -->
        <rect x="20" y="40" width="20" height="40" fill="#2A180F"/>
        <!-- Chimney -->
        <rect x="125" y="-30" width="14" height="20" fill="#4A2D1F"/>
    </g>

    <!-- Smoke trail -->
    <g fill="#FFFFFF" opacity="0.4">
        <ellipse cx="552" cy="395" rx="14" ry="8"/>
        <ellipse cx="565" cy="370" rx="18" ry="10"/>
        <ellipse cx="580" cy="335" rx="22" ry="12"/>
        <ellipse cx="600" cy="295" rx="26" ry="14"/>
    </g>

    <!-- Pine trees beside cabin -->
    <g fill="#1A2438">
        <polygon points="370,540 350,470 390,470 360,420 400,420 370,370"/>
        <polygon points="630,540 612,475 648,475 622,425 658,425 630,375"/>
        <polygon points="710,560 690,490 730,490 700,440 740,440 710,390"/>
        <polygon points="290,560 270,490 310,490 280,440 320,440 290,390"/>
    </g>

    <text x="60" y="610" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="14" opacity="0.7"
          letter-spacing="2">lingcoder.com
    </text>
</svg>
