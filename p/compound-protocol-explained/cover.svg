<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#3D2050"/>
          <stop offset="0.5" stop-color="#A04830"/>
          <stop offset="1" stop-color="#FFB058"/>
    </linearGradient>
  </defs>

    <rect width="1200" height="430" fill="url(#sky)"/>

    <!-- Moon -->
    <circle cx="950" cy="160" r="50" fill="#F8E0A8"/>
    <circle cx="950" cy="160" r="80" fill="#F8E0A8" opacity="0.18"/>

    <!-- Bats silhouettes -->
    <g fill="#1F0A20">
        <path d="M 350 180 Q 345 175 340 180 Q 345 178 350 182 Q 355 178 360 180 Q 355 175 350 180"/>
        <path d="M 450 220 Q 445 215 440 220 Q 445 218 450 222 Q 455 218 460 220 Q 455 215 450 220"/>
        <path d="M 700 150 Q 695 145 690 150 Q 695 148 700 152 Q 705 148 710 150 Q 705 145 700 150"/>
    </g>

    <!-- Stars -->
    <g fill="#FFFFFF">
        <circle cx="80" cy="60" r="1.2" opacity="0.85"/>
        <circle cx="200" cy="100" r="1" opacity="0.7"/>
        <circle cx="380" cy="50" r="1.3" opacity="0.85"/>
        <circle cx="600" cy="80" r="1" opacity="0.7"/>
        <circle cx="820" cy="60" r="1.2" opacity="0.8"/>
        <circle cx="1080" cy="100" r="1.3" opacity="0.85"/>
  </g>

    <!-- Distant hill silhouette -->
    <path d="M 0 430 L 100 360 L 250 400 L 400 350 L 550 390 L 700 340 L 850 380 L 1000 350 L 1200 380 L 1200 470 L 0 470 Z"
          fill="#1F0A28" opacity="0.85"/>

    <!-- Spooky tree -->
    <g transform="translate(150,470)" fill="#0A0512" stroke="#0A0512" stroke-width="3" stroke-linecap="round">
        <rect x="-8" y="0" width="16" height="160"/>
        <line x1="0" y1="-10" x2="-50" y2="-80"/>
        <line x1="0" y1="-10" x2="50" y2="-90"/>
        <line x1="0" y1="-30" x2="-30" y2="-110"/>
        <line x1="0" y1="-30" x2="30" y2="-130"/>
        <line x1="0" y1="-50" x2="-15" y2="-150"/>
        <line x1="-50" y1="-80" x2="-70" y2="-110"/>
        <line x1="50" y1="-90" x2="70" y2="-110"/>
        <line x1="-30" y1="-110" x2="-45" y2="-140"/>
        <line x1="30" y1="-130" x2="40" y2="-160"/>
  </g>

    <!-- Pumpkin field ground -->
    <path d="M 0 470 Q 600 450 1200 480 L 1200 630 L 0 630 Z" fill="#3D2818"/>
    <path d="M 0 530 Q 600 510 1200 540 L 1200 630 L 0 630 Z" fill="#1F1408"/>

    <!-- Pumpkins -->
    <g>
        <g transform="translate(280,560)">
            <ellipse cx="-12" cy="0" rx="16" ry="20" fill="#E07020"/>
            <ellipse cx="0" cy="0" rx="20" ry="24" fill="#FF8830"/>
            <ellipse cx="12" cy="0" rx="16" ry="20" fill="#E07020"/>
            <rect x="-2" y="-26" width="4" height="8" fill="#3D5018"/>
        </g>
        <g transform="translate(420,580)">
            <ellipse cx="-10" cy="0" rx="14" ry="18" fill="#E07020"/>
            <ellipse cx="0" cy="0" rx="18" ry="22" fill="#FF8830"/>
            <ellipse cx="10" cy="0" rx="14" ry="18" fill="#E07020"/>
            <rect x="-2" y="-24" width="4" height="6" fill="#3D5018"/>
        </g>
        <g transform="translate(600,570)">
            <ellipse cx="-13" cy="0" rx="17" ry="22" fill="#E07020"/>
            <ellipse cx="0" cy="0" rx="22" ry="26" fill="#FF9840"/>
            <ellipse cx="13" cy="0" rx="17" ry="22" fill="#E07020"/>
            <rect x="-2" y="-28" width="4" height="8" fill="#3D5018"/>
            <!-- Jack o lantern face -->
            <polygon points="-8,-8 -4,-12 0,-8" fill="#1F0408"/>
            <polygon points="8,-8 4,-12 0,-8" fill="#1F0408"/>
            <path d="M -10 4 L -6 0 L -2 4 L 2 0 L 6 4 L 10 0" stroke="#1F0408" stroke-width="2" fill="none"/>
        </g>
        <g transform="translate(800,585)">
            <ellipse cx="-11" cy="0" rx="15" ry="19" fill="#E07020"/>
            <ellipse cx="0" cy="0" rx="19" ry="23" fill="#FF8830"/>
            <ellipse cx="11" cy="0" rx="15" ry="19" fill="#E07020"/>
            <rect x="-2" y="-25" width="4" height="7" fill="#3D5018"/>
        </g>
        <g transform="translate(960,565)">
            <ellipse cx="-12" cy="0" rx="16" ry="20" fill="#E07020"/>
            <ellipse cx="0" cy="0" rx="20" ry="24" fill="#FF8830"/>
            <ellipse cx="12" cy="0" rx="16" ry="20" fill="#E07020"/>
            <rect x="-2" y="-26" width="4" height="8" fill="#3D5018"/>
        </g>
  </g>

    <!-- Fog -->
    <g fill="#FFB058" opacity="0.18">
        <ellipse cx="600" cy="450" rx="500" ry="20"/>
        <ellipse cx="200" cy="470" rx="200" ry="15"/>
        <ellipse cx="1000" cy="465" rx="200" ry="15"/>
    </g>

    <text x="60" y="615" fill="#FFB058" font-family="-apple-system, sans-serif" font-size="14" opacity="0.85"
          letter-spacing="2">lingcoder.com
    </text>
</svg>
