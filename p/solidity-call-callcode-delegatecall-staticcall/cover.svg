<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
      <linearGradient id="nightSky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#0A0F2E"/>
          <stop offset="1" stop-color="#1F2548"/>
      </linearGradient>
      <linearGradient id="aurora1" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#7BFFB0" stop-opacity="0"/>
          <stop offset="0.4" stop-color="#7BFFB0" stop-opacity="0.55"/>
          <stop offset="0.8" stop-color="#3DAA85" stop-opacity="0.4"/>
          <stop offset="1" stop-color="#3DAA85" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="aurora2" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#A55ED8" stop-opacity="0"/>
          <stop offset="0.45" stop-color="#A55ED8" stop-opacity="0.4"/>
          <stop offset="1" stop-color="#A55ED8" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#0A1A30"/>
          <stop offset="1" stop-color="#000A1A"/>
    </linearGradient>
  </defs>

    <rect width="1200" height="630" fill="url(#nightSky)"/>

    <!-- Stars -->
    <g fill="#FFFFFF">
        <circle cx="100" cy="60" r="1.4" opacity="0.95"/>
        <circle cx="220" cy="40" r="1" opacity="0.7"/>
        <circle cx="340" cy="80" r="1.6" opacity="0.95"/>
        <circle cx="460" cy="50" r="1.1" opacity="0.7"/>
        <circle cx="600" cy="70" r="1.3" opacity="0.85"/>
        <circle cx="740" cy="40" r="1" opacity="0.6"/>
        <circle cx="880" cy="80" r="1.5" opacity="0.9"/>
        <circle cx="1000" cy="50" r="1.1" opacity="0.7"/>
        <circle cx="1100" cy="70" r="1.3" opacity="0.85"/>
        <circle cx="160" cy="120" r="1" opacity="0.55"/>
        <circle cx="280" cy="140" r="0.9" opacity="0.5"/>
        <circle cx="400" cy="120" r="1.2" opacity="0.7"/>
        <circle cx="540" cy="130" r="0.8" opacity="0.4"/>
    </g>

    <!-- Aurora layer 1 (green) -->
    <path d="M 0 100 Q 200 60 400 130 Q 600 200 800 100 Q 1000 30 1200 130 L 1200 380 Q 1000 320 800 380 Q 600 440 400 360 Q 200 290 0 380 Z"
          fill="url(#aurora1)"/>
    <!-- Aurora layer 2 (purple) -->
    <path d="M 0 50 Q 250 100 500 80 Q 750 60 1000 110 Q 1100 130 1200 100 L 1200 280 Q 950 230 700 290 Q 450 340 200 280 Q 100 250 0 290 Z"
          fill="url(#aurora2)" opacity="0.85"/>

    <!-- Aurora glow column 1 -->
    <ellipse cx="350" cy="220" rx="80" ry="160" fill="#7BFFB0" opacity="0.18"/>
    <!-- Aurora glow column 2 -->
    <ellipse cx="850" cy="200" rx="100" ry="180" fill="#7BFFB0" opacity="0.15"/>

    <!-- Snow mountain -->
    <path d="M 0 480 L 200 320 L 380 420 L 580 300 L 780 410 L 980 340 L 1200 420 L 1200 510 L 0 510 Z"
          fill="#3D4A5A"/>
    <!-- Snow caps -->
    <g fill="#FFFFFF" opacity="0.9">
        <path d="M 200 320 L 245 380 L 155 380 Z"/>
        <path d="M 580 300 L 625 365 L 535 365 Z"/>
        <path d="M 980 340 L 1020 400 L 940 400 Z"/>
    </g>

    <!-- Lake -->
    <rect y="510" width="1200" height="120" fill="url(#lake)"/>

    <!-- Aurora reflection -->
    <g opacity="0.4">
        <ellipse cx="350" cy="540" rx="80" ry="20" fill="#7BFFB0"/>
        <ellipse cx="850" cy="535" rx="100" ry="22" fill="#7BFFB0"/>
    </g>

    <!-- Mountain reflection -->
    <g transform="translate(0,1020) scale(1,-1)" opacity="0.4">
        <path d="M 0 480 L 200 320 L 380 420 L 580 300 L 780 410 L 980 340 L 1200 420 L 1200 510 L 0 510 Z"
              fill="#3D4A5A"/>
  </g>

    <text x="60" y="610" fill="#7BFFB0" font-family="-apple-system, sans-serif" font-size="14" opacity="0.7"
          letter-spacing="2">lingcoder.com
    </text>
</svg>
