<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
    <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#FFD8A0"/>
            <stop offset="1" stop-color="#FFB87C"/>
        </linearGradient>
        <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#7A4A30"/>
            <stop offset="1" stop-color="#3D2515"/>
        </linearGradient>
    </defs>

    <rect width="1200" height="320" fill="url(#sky)"/>

    <!-- Sun -->
    <circle cx="900" cy="180" r="60" fill="#FFE5B0" opacity="0.95"/>
    <circle cx="900" cy="180" r="180" fill="#FFE5B0" opacity="0.18"/>

    <!-- Distant tree line - autumn -->
    <g>
        <ellipse cx="80" cy="320" rx="55" ry="40" fill="#B82E14"/>
        <ellipse cx="180" cy="315" rx="65" ry="45" fill="#FF7C30"/>
        <ellipse cx="280" cy="320" rx="55" ry="40" fill="#FFA438"/>
        <ellipse cx="380" cy="315" rx="65" ry="45" fill="#D8401C"/>
        <ellipse cx="480" cy="320" rx="55" ry="40" fill="#FF6B2E"/>
        <ellipse cx="580" cy="315" rx="65" ry="45" fill="#FFA438"/>
        <ellipse cx="680" cy="320" rx="55" ry="40" fill="#B82E14"/>
        <ellipse cx="780" cy="315" rx="65" ry="45" fill="#FF7C30"/>
        <ellipse cx="1000" cy="320" rx="55" ry="40" fill="#D8401C"/>
        <ellipse cx="1100" cy="315" rx="65" ry="45" fill="#FF6B2E"/>
        <ellipse cx="1180" cy="320" rx="55" ry="40" fill="#FFA438"/>
    </g>

    <!-- Lake -->
    <rect y="320" width="1200" height="310" fill="url(#lake)"/>

    <!-- Reflection -->
    <g transform="translate(0,640) scale(1,-1)" opacity="0.55">
        <ellipse cx="80" cy="320" rx="55" ry="40" fill="#B82E14"/>
        <ellipse cx="180" cy="315" rx="65" ry="45" fill="#FF7C30"/>
        <ellipse cx="280" cy="320" rx="55" ry="40" fill="#FFA438"/>
        <ellipse cx="380" cy="315" rx="65" ry="45" fill="#D8401C"/>
        <ellipse cx="480" cy="320" rx="55" ry="40" fill="#FF6B2E"/>
        <ellipse cx="580" cy="315" rx="65" ry="45" fill="#FFA438"/>
        <ellipse cx="680" cy="320" rx="55" ry="40" fill="#B82E14"/>
        <ellipse cx="780" cy="315" rx="65" ry="45" fill="#FF7C30"/>
        <ellipse cx="1000" cy="320" rx="55" ry="40" fill="#D8401C"/>
        <ellipse cx="1100" cy="315" rx="65" ry="45" fill="#FF6B2E"/>
        <ellipse cx="1180" cy="320" rx="55" ry="40" fill="#FFA438"/>
    </g>

    <!-- Sun reflection -->
    <g fill="#FFE5B0" opacity="0.55">
        <ellipse cx="900" cy="370" rx="55" ry="3"/>
        <ellipse cx="900" cy="395" rx="42" ry="2.5"/>
        <ellipse cx="900" cy="420" rx="32" ry="2"/>
    </g>

    <!-- Ripples -->
    <g fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.5">
        <path d="M 200 460 q 30 -4 60 0 t 60 0"/>
        <path d="M 600 490 q 40 -5 80 0 t 80 0"/>
        <path d="M 300 540 q 30 -4 60 0 t 60 0"/>
        <path d="M 800 555 q 40 -5 80 0 t 80 0"/>
    </g>

    <!-- Floating leaves on water -->
    <g>
        <ellipse cx="150" cy="500" rx="6" ry="3" fill="#D8401C" opacity="0.85"/>
        <ellipse cx="320" cy="540" rx="6" ry="3" fill="#FFA438" opacity="0.85"/>
        <ellipse cx="500" cy="510" rx="6" ry="3" fill="#FF6B2E" opacity="0.85"/>
        <ellipse cx="700" cy="540" rx="6" ry="3" fill="#D8401C" opacity="0.85"/>
        <ellipse cx="850" cy="500" rx="6" ry="3" fill="#FFA438" opacity="0.85"/>
        <ellipse cx="1050" cy="540" rx="6" ry="3" fill="#FF6B2E" opacity="0.85"/>
        <ellipse cx="240" cy="600" rx="7" ry="3.5" fill="#D8401C" opacity="0.85"/>
        <ellipse cx="600" cy="610" rx="7" ry="3.5" fill="#FFA438" opacity="0.85"/>
        <ellipse cx="900" cy="595" rx="7" ry="3.5" fill="#FF6B2E" opacity="0.85"/>
    </g>

    <text x="60" y="618" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="14" opacity="0.85"
          letter-spacing="2">lingcoder.com
    </text>
</svg>
