<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
    <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#E0BCC8"/>
            <stop offset="0.55" stop-color="#FFE0B0"/>
            <stop offset="1" stop-color="#FFD8A0"/>
        </linearGradient>
        <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#5C7A8C"/>
            <stop offset="1" stop-color="#2E3D4A"/>
        </linearGradient>
        <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#FFE5C8" stop-opacity="0.65"/>
            <stop offset="1" stop-color="#FFE5C8" stop-opacity="0"/>
        </radialGradient>
    </defs>

    <rect width="1200" height="320" fill="url(#sky)"/>

    <!-- Sun rising behind mountain -->
    <circle cx="700" cy="280" r="240" fill="url(#sunGlow)"/>
    <circle cx="700" cy="280" r="50" fill="#FFE5C8" opacity="0.85"/>

    <!-- Distant mountain -->
    <path d="M 0 320 L 200 100 L 380 240 L 600 80 L 820 230 L 1000 130 L 1200 240 L 1200 380 L 0 380 Z"
          fill="#5C788C" opacity="0.8"/>
    <g fill="#FFFFFF" opacity="0.92">
        <path d="M 200 100 L 245 165 L 155 165 Z"/>
        <path d="M 600 80 L 645 145 L 555 145 Z"/>
        <path d="M 1000 130 L 1040 195 L 960 195 Z"/>
    </g>

    <!-- Mist over base of mountain -->
    <ellipse cx="600" cy="290" rx="700" ry="18" fill="#FFFFFF" opacity="0.5"/>
    <ellipse cx="600" cy="305" rx="650" ry="14" fill="#FFFFFF" opacity="0.4"/>

    <!-- Lake -->
    <rect y="320" width="1200" height="310" fill="url(#lake)"/>

    <!-- Mountain reflection -->
    <g transform="translate(0,640) scale(1,-1)" opacity="0.55">
        <path d="M 0 320 L 200 100 L 380 240 L 600 80 L 820 230 L 1000 130 L 1200 240 L 1200 380 L 0 380 Z"
              fill="#5C788C"/>
        <g fill="#FFFFFF" opacity="0.85">
            <path d="M 200 100 L 245 165 L 155 165 Z"/>
            <path d="M 600 80 L 645 145 L 555 145 Z"/>
            <path d="M 1000 130 L 1040 195 L 960 195 Z"/>
        </g>
    </g>

    <!-- Sun reflection -->
    <g fill="#FFE5C8" opacity="0.5">
        <ellipse cx="700" cy="380" rx="80" ry="3.5"/>
        <ellipse cx="700" cy="405" rx="60" ry="3"/>
        <ellipse cx="700" cy="430" rx="42" ry="2.5"/>
    </g>

    <!-- Subtle ripples -->
    <g fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1.5">
        <path d="M 100 480 q 30 -4 60 0 t 60 0 t 60 0"/>
        <path d="M 800 510 q 30 -4 60 0 t 60 0"/>
        <path d="M 200 570 q 50 -6 100 0 t 100 0"/>
    </g>

    <!-- Foreground reeds left -->
    <g stroke="#1F2E2A" stroke-width="2" stroke-linecap="round" fill="none">
        <line x1="80" y1="540" x2="78" y2="450"/>
        <line x1="100" y1="555" x2="102" y2="430"/>
        <line x1="120" y1="540" x2="118" y2="445"/>
        <line x1="140" y1="555" x2="142" y2="450"/>
    </g>
    <g fill="#3A4A3A">
        <ellipse cx="78" cy="450" rx="3" ry="8"/>
        <ellipse cx="102" cy="430" rx="3" ry="8"/>
        <ellipse cx="118" cy="445" rx="3" ry="8"/>
        <ellipse cx="142" cy="450" rx="3" ry="8"/>
    </g>

    <text x="60" y="608" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="14" opacity="0.85"
          letter-spacing="2">lingcoder.com
    </text>
</svg>
