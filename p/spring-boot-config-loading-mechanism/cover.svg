<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#5CA0C8"/>
          <stop offset="1" stop-color="#FFD8A0"/>
      </linearGradient>
      <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#3DA0C0"/>
          <stop offset="1" stop-color="#1F5878"/>
    </linearGradient>
      <linearGradient id="cliff" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#A87858"/>
          <stop offset="1" stop-color="#5C3828"/>
      </linearGradient>
  </defs>

    <rect width="1200" height="350" fill="url(#sky)"/>
    <rect y="350" width="1200" height="280" fill="url(#sea)"/>

    <!-- Sun -->
    <circle cx="800" cy="280" r="45" fill="#FFE0A0" opacity="0.95"/>
    <ellipse cx="800" cy="400" rx="55" ry="6" fill="#FFE0A0" opacity="0.6"/>

    <!-- Wave caps -->
    <g fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="1.5">
        <path d="M 700 440 q 30 -5 60 0 t 60 0"/>
        <path d="M 850 470 q 30 -5 60 0 t 60 0"/>
        <path d="M 600 510 q 50 -7 100 0 t 100 0"/>
        <path d="M 900 540 q 50 -7 100 0 t 100 0"/>
    </g>

    <!-- Cliff with terraced village -->
    <path d="M 0 200 L 0 630 L 540 630 L 540 380 Q 460 350 380 320 Q 320 290 280 250 Q 220 220 180 230 Q 100 200 0 200 Z"
          fill="url(#cliff)"/>

    <!-- Houses on cliff terraces -->
    <g>
        <!-- Top tier -->
        <g transform="translate(150,250)">
            <rect x="-20" y="-25" width="40" height="25" fill="#F0E0C8"/>
            <polygon points="-22,-25 0,-38 22,-25" fill="#C04030"/>
            <rect x="-10" y="-15" width="6" height="6" fill="#5C8AC0"/>
            <rect x="4" y="-15" width="6" height="6" fill="#5C8AC0"/>
    </g>
        <g transform="translate(220,260)">
            <rect x="-22" y="-28" width="44" height="28" fill="#F8E8B0"/>
            <polygon points="-25,-28 0,-42 25,-28" fill="#A03020"/>
            <rect x="-10" y="-18" width="7" height="8" fill="#5C8AC0"/>
            <rect x="3" y="-18" width="7" height="8" fill="#5C8AC0"/>
    </g>
        <g transform="translate(290,275)">
            <rect x="-20" y="-25" width="40" height="25" fill="#F0D8A8"/>
            <polygon points="-22,-25 0,-38 22,-25" fill="#C04030"/>
            <rect x="-7" y="-15" width="6" height="7" fill="#5C8AC0"/>
    </g>

        <!-- Mid tier -->
        <g transform="translate(120,330)">
            <rect x="-25" y="-30" width="50" height="30" fill="#FFFFFF"/>
            <polygon points="-28,-30 0,-46 28,-30" fill="#A03020"/>
            <rect x="-12" y="-20" width="8" height="9" fill="#5C8AC0"/>
            <rect x="4" y="-20" width="8" height="9" fill="#5C8AC0"/>
    </g>
        <g transform="translate(200,345)">
            <rect x="-22" y="-28" width="44" height="28" fill="#F8E0C0"/>
            <polygon points="-25,-28 0,-42 25,-28" fill="#C04030"/>
            <rect x="-10" y="-18" width="7" height="8" fill="#5C8AC0"/>
            <rect x="3" y="-18" width="7" height="8" fill="#5C8AC0"/>
    </g>
        <g transform="translate(290,360)">
            <rect x="-22" y="-28" width="44" height="28" fill="#F0E8B0"/>
            <polygon points="-25,-28 0,-42 25,-28" fill="#A03020"/>
            <rect x="-9" y="-18" width="7" height="8" fill="#5C8AC0"/>
            <rect x="2" y="-18" width="7" height="8" fill="#5C8AC0"/>
    </g>
        <g transform="translate(380,375)">
            <rect x="-22" y="-28" width="44" height="28" fill="#FFFFFF"/>
            <polygon points="-25,-28 0,-42 25,-28" fill="#C04030"/>
            <rect x="-9" y="-18" width="7" height="8" fill="#5C8AC0"/>
    </g>

        <!-- Bottom tier -->
        <g transform="translate(150,420)">
            <rect x="-26" y="-32" width="52" height="32" fill="#F0D8B8"/>
            <polygon points="-29,-32 0,-48 29,-32" fill="#A03020"/>
            <rect x="-12" y="-22" width="9" height="10" fill="#5C8AC0"/>
            <rect x="3" y="-22" width="9" height="10" fill="#5C8AC0"/>
    </g>
        <g transform="translate(250,440)">
            <rect x="-26" y="-32" width="52" height="32" fill="#FFFFFF"/>
            <polygon points="-29,-32 0,-48 29,-32" fill="#C04030"/>
            <rect x="-12" y="-22" width="9" height="10" fill="#5C8AC0"/>
            <rect x="3" y="-22" width="9" height="10" fill="#5C8AC0"/>
    </g>
        <g transform="translate(360,460)">
            <rect x="-26" y="-32" width="52" height="32" fill="#F8E0B8"/>
            <polygon points="-29,-32 0,-48 29,-32" fill="#A03020"/>
            <rect x="-12" y="-22" width="9" height="10" fill="#5C8AC0"/>
            <rect x="3" y="-22" width="9" height="10" fill="#5C8AC0"/>
    </g>
        <g transform="translate(460,490)">
            <rect x="-26" y="-32" width="52" height="32" fill="#FFFFFF"/>
            <polygon points="-29,-32 0,-48 29,-32" fill="#C04030"/>
            <rect x="-9" y="-22" width="7" height="9" fill="#5C8AC0"/>
        </g>
    </g>

    <!-- Distant cliff -->
    <path d="M 1100 380 L 1200 320 L 1200 630 L 1000 630 Z" fill="url(#cliff)" opacity="0.7"/>

    <!-- Sailboat -->
    <g transform="translate(900,450)">
        <polygon points="-20,0 20,0 16,8 -16,8" fill="#3A2D2A"/>
        <line x1="0" y1="0" x2="0" y2="-40" stroke="#3A2D2A" stroke-width="2"/>
        <polygon points="0,-40 0,-5 25,-5" fill="#FFFFFF"/>
    </g>

    <!-- Birds -->
    <g fill="none" stroke="#3D2818" stroke-width="2" stroke-linecap="round">
        <path d="M 700 200 q 6 -7 12 0 q 6 -7 12 0"/>
        <path d="M 950 180 q 5 -6 10 0 q 5 -6 10 0"/>
    </g>

    <text x="60" y="615" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="14" opacity="0.85"
          letter-spacing="2">lingcoder.com
    </text>
</svg>
