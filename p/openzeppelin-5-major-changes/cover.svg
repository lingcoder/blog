<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
    <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#5CB8E0"/>
            <stop offset="1" stop-color="#C8E8F0"/>
        </linearGradient>
        <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#3DA8C8"/>
            <stop offset="1" stop-color="#1F6878"/>
        </linearGradient>
    </defs>

    <rect width="1200" height="320" fill="url(#sky)"/>

    <!-- Sun -->
    <circle cx="950" cy="120" r="40" fill="#FFE5A0"/>
    <circle cx="950" cy="120" r="80" fill="#FFE5A0" opacity="0.25"/>

    <!-- Clouds -->
    <g fill="#FFFFFF" opacity="0.9">
        <ellipse cx="200" cy="100" rx="80" ry="20"/>
        <ellipse cx="240" cy="85" rx="60" ry="16"/>
        <ellipse cx="600" cy="80" rx="100" ry="22"/>
        <ellipse cx="640" cy="65" rx="70" ry="18"/>
    </g>

    <!-- Sea -->
    <rect y="320" width="1200" height="180" fill="url(#sea)"/>

    <!-- Distant island -->
    <path d="M 100 340 Q 200 310 300 330 Q 380 320 460 340 Z" fill="#5C808C" opacity="0.6"/>

    <!-- Wave caps -->
    <g fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="1.5">
        <path d="M 100 380 q 30 -5 60 0 t 60 0"/>
        <path d="M 500 400 q 30 -5 60 0 t 60 0"/>
        <path d="M 900 390 q 30 -5 60 0 t 60 0"/>
        <path d="M 200 440 q 50 -7 100 0 t 100 0"/>
        <path d="M 800 450 q 50 -7 100 0 t 100 0"/>
    </g>

    <!-- Beach -->
    <path d="M 0 500 Q 400 480 800 490 Q 1000 485 1200 495 L 1200 630 L 0 630 Z" fill="#F8DCA8"/>
    <path d="M 0 560 Q 400 545 800 555 Q 1000 550 1200 560 L 1200 630 L 0 630 Z" fill="#E8C088"/>

    <!-- Beach umbrella -->
    <g transform="translate(350,580)">
        <line x1="0" y1="0" x2="0" y2="-130" stroke="#5C3820" stroke-width="3"/>
        <path d="M -75 -130 Q 0 -180 75 -130 Z" fill="#E03048"/>
        <g fill="#FFFFFF">
            <path d="M -75 -130 Q -38 -150 0 -130 L 0 -135 L -75 -135 Z"/>
            <path d="M 0 -130 Q 38 -150 75 -130 L 75 -135 L 0 -135 Z"/>
        </g>
        <line x1="-75" y1="-130" x2="0" y2="-180" stroke="#A02030" stroke-width="1"/>
        <line x1="0" y1="-180" x2="75" y2="-130" stroke="#A02030" stroke-width="1"/>
        <line x1="-38" y1="-150" x2="0" y2="-130" stroke="#A02030" stroke-width="1"/>
        <line x1="38" y1="-150" x2="0" y2="-130" stroke="#A02030" stroke-width="1"/>
    </g>

    <!-- Beach chair -->
    <g transform="translate(420,580)">
        <rect x="0" y="-15" width="60" height="6" fill="#FFFFFF" rx="2"/>
        <rect x="0" y="-15" width="6" height="20" fill="#FFFFFF"/>
        <rect x="54" y="-15" width="6" height="20" fill="#FFFFFF"/>
    </g>

    <!-- Starfish on sand -->
    <g transform="translate(800,610)" fill="#E08858">
        <polygon points="0,-12 4,-4 12,-4 5,2 8,12 0,6 -8,12 -5,2 -12,-4 -4,-4"/>
    </g>
    <g transform="translate(950,580)" fill="#E08858">
        <polygon points="0,-10 3,-3 10,-3 4,2 6,10 0,5 -6,10 -4,2 -10,-3 -3,-3"/>
    </g>

    <!-- Shell -->
    <g transform="translate(1050,600)" fill="#E0B0A0">
        <path d="M 0 0 Q -10 -10 0 -15 Q 10 -10 0 0 Z"/>
        <path d="M 0 -3 L 0 -12" stroke="#A87060" stroke-width="0.8" fill="none"/>
    </g>

    <!-- Birds -->
    <g fill="none" stroke="#3D5060" stroke-width="2" stroke-linecap="round">
        <path d="M 350 130 q 6 -7 12 0 q 6 -7 12 0"/>
        <path d="M 800 100 q 5 -6 10 0 q 5 -6 10 0"/>
    </g>

    <text x="60" y="615" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="14" opacity="0.85"
          letter-spacing="2">lingcoder.com
    </text>
</svg>
