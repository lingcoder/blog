<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
    <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#FFB37A"/>
            <stop offset="0.5" stop-color="#FF6B5C"/>
            <stop offset="1" stop-color="#9C2D5C"/>
        </linearGradient>
        <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#5C2D58"/>
            <stop offset="1" stop-color="#1F1638"/>
        </linearGradient>
        <radialGradient id="sunRay" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#FFE085" stop-opacity="0.65"/>
            <stop offset="1" stop-color="#FFE085" stop-opacity="0"/>
        </radialGradient>
    </defs>

    <rect width="1200" height="380" fill="url(#sky)"/>

    <!-- Sun -->
    <circle cx="600" cy="290" r="220" fill="url(#sunRay)"/>
    <circle cx="600" cy="290" r="55" fill="#FFE3A0"/>

    <!-- Wisp clouds -->
    <g fill="#FFB8A8" opacity="0.5">
        <ellipse cx="200" cy="140" rx="100" ry="6"/>
        <ellipse cx="900" cy="100" rx="120" ry="5"/>
        <ellipse cx="1050" cy="180" rx="80" ry="4"/>
    </g>

    <!-- Sea -->
    <rect y="380" width="1200" height="250" fill="url(#sea)"/>

    <!-- Distant cliff right -->
    <path d="M 800 380 L 850 320 L 900 280 L 980 260 L 1080 280 L 1200 270 L 1200 380 Z"
          fill="#3D1F4A" opacity="0.85"/>

    <!-- Foreground cliff left -->
    <path d="M 0 380 L 80 290 L 160 250 L 240 230 L 340 280 L 380 310 L 380 380 Z"
          fill="#1F0A2E"/>
    <!-- Cliff base -->
    <rect width="380" y="380" height="250" fill="#1F0A2E"/>

    <!-- Tiny tree on cliff -->
    <g fill="#0A0214">
        <ellipse cx="180" cy="225" rx="14" ry="22"/>
        <rect x="178" y="224" width="3" height="8"/>
    </g>

    <!-- Sun reflection -->
    <g fill="#FFE3A0" opacity="0.55">
        <ellipse cx="600" cy="400" rx="80" ry="5"/>
        <ellipse cx="600" cy="425" rx="60" ry="4"/>
        <ellipse cx="600" cy="450" rx="42" ry="3"/>
        <ellipse cx="600" cy="475" rx="28" ry="2"/>
    </g>

    <!-- Wave hints -->
    <g fill="none" stroke="#FFE3A0" stroke-opacity="0.18" stroke-width="1.5">
        <path d="M 450 530 q 20 -3 40 0 t 40 0 t 40 0"/>
        <path d="M 700 555 q 20 -3 40 0 t 40 0 t 40 0"/>
    </g>

    <!-- Birds -->
    <g fill="none" stroke="#3D1F4A" stroke-width="2" stroke-linecap="round">
        <path d="M 380 180 q 6 -8 12 0 q 6 -8 12 0"/>
        <path d="M 420 210 q 5 -7 10 0 q 5 -7 10 0"/>
        <path d="M 460 195 q 4 -6 8 0 q 4 -6 8 0"/>
    </g>

    <text x="60" y="608" fill="#FFE3A0" font-family="-apple-system, sans-serif" font-size="14" opacity="0.75"
          letter-spacing="2">lingcoder.com
    </text>
</svg>
