<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
    <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#A8D0E0"/>
            <stop offset="1" stop-color="#D8E8C0"/>
        </linearGradient>
        <linearGradient id="cliff" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#5C7240"/>
            <stop offset="1" stop-color="#2E3D1A"/>
        </linearGradient>
        <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#FFFFFF"/>
            <stop offset="1" stop-color="#7BB8C8"/>
        </linearGradient>
    </defs>

    <rect width="1200" height="160" fill="url(#sky)"/>

    <!-- Distant misty mountains -->
    <path d="M 0 160 L 150 100 L 320 130 L 500 80 L 700 120 L 880 90 L 1080 130 L 1200 110 L 1200 200 L 0 200 Z"
          fill="#9CB098" opacity="0.55"/>

    <!-- Background jungle -->
    <g fill="#3A5C2A" opacity="0.85">
        <ellipse cx="100" cy="280" rx="120" ry="120"/>
        <ellipse cx="280" cy="290" rx="140" ry="130"/>
        <ellipse cx="900" cy="290" rx="140" ry="130"/>
        <ellipse cx="1100" cy="280" rx="120" ry="120"/>
    </g>

    <!-- Cliff frame around waterfall -->
    <path d="M 380 200 L 420 240 L 440 280 L 460 360 L 480 460 L 0 460 L 0 200 Z"
          fill="url(#cliff)"/>
    <path d="M 820 200 L 780 240 L 760 280 L 740 360 L 720 460 L 1200 460 L 1200 200 Z"
          fill="url(#cliff)"/>

    <!-- Vegetation on cliffs -->
    <g fill="#1F3A18">
        <ellipse cx="350" cy="220" rx="40" ry="20"/>
        <ellipse cx="850" cy="220" rx="42" ry="22"/>
        <ellipse cx="290" cy="280" rx="35" ry="18"/>
        <ellipse cx="910" cy="280" rx="35" ry="18"/>
        <ellipse cx="220" cy="370" rx="38" ry="20"/>
        <ellipse cx="980" cy="370" rx="40" ry="22"/>
    </g>

    <!-- Waterfall -->
    <rect x="475" y="200" width="250" height="350" fill="url(#water)"/>

    <!-- Waterfall texture lines -->
    <g stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.7" fill="none">
        <line x1="490" y1="220" x2="490" y2="540"/>
        <line x1="510" y1="220" x2="510" y2="540"/>
        <line x1="530" y1="220" x2="530" y2="540"/>
        <line x1="550" y1="220" x2="550" y2="540"/>
        <line x1="570" y1="220" x2="570" y2="540"/>
        <line x1="590" y1="220" x2="590" y2="540"/>
        <line x1="610" y1="220" x2="610" y2="540"/>
        <line x1="630" y1="220" x2="630" y2="540"/>
        <line x1="650" y1="220" x2="650" y2="540"/>
        <line x1="670" y1="220" x2="670" y2="540"/>
        <line x1="690" y1="220" x2="690" y2="540"/>
        <line x1="710" y1="220" x2="710" y2="540"/>
    </g>

    <!-- Pool at base with mist -->
    <ellipse cx="600" cy="555" rx="270" ry="55" fill="#FFFFFF" opacity="0.55"/>
    <ellipse cx="600" cy="555" rx="240" ry="40" fill="#A8D8DC"/>

    <!-- Pool ripples -->
    <g fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="1.5">
        <ellipse cx="600" cy="555" rx="200" ry="22" fill="none"/>
        <ellipse cx="600" cy="565" rx="150" ry="14"/>
    </g>

    <!-- Foreground rocks -->
    <g fill="#1A2010">
        <ellipse cx="60" cy="600" rx="100" ry="14"/>
        <ellipse cx="1140" cy="605" rx="100" ry="14"/>
    </g>

    <text x="60" y="618" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="14" opacity="0.85"
          letter-spacing="2">lingcoder.com
    </text>
</svg>
