<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB88E"/>
      <stop offset="0.4" stop-color="#FF8C66"/>
      <stop offset="0.85" stop-color="#9C4E96"/>
      <stop offset="1" stop-color="#3D2F66"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5C3A7A"/>
      <stop offset="1" stop-color="#1F1438"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE08A" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#FFE08A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="430" fill="url(#sky)"/>

  <!-- Sun glow -->
  <circle cx="850" cy="280" r="240" fill="url(#sunGlow)"/>
  <!-- Sun -->
  <circle cx="850" cy="280" r="65" fill="#FFE7A0"/>

  <!-- Distant mountain layer 1 -->
  <path d="M 0 360 L 180 270 L 320 320 L 480 230 L 640 290 L 800 220 L 960 290 L 1120 240 L 1200 280 L 1200 430 L 0 430 Z"
        fill="#6B3E78" fill-opacity="0.85"/>

  <!-- Distant mountain layer 2 -->
  <path d="M 0 400 L 130 320 L 280 360 L 440 300 L 580 350 L 740 290 L 900 360 L 1080 310 L 1200 350 L 1200 430 L 0 430 Z"
        fill="#3D2A58" fill-opacity="0.9"/>

  <!-- Foreground mountain -->
  <path d="M 0 430 L 200 340 L 380 400 L 560 320 L 760 380 L 980 340 L 1200 400 L 1200 430 Z"
        fill="#1F1438"/>

  <!-- Water with reflection -->
  <rect y="430" width="1200" height="200" fill="url(#water)"/>

  <!-- Sun reflection on water -->
  <ellipse cx="850" cy="450" rx="90" ry="6" fill="#FFE7A0" fill-opacity="0.5"/>
  <ellipse cx="850" cy="475" rx="70" ry="4" fill="#FFE7A0" fill-opacity="0.35"/>
  <ellipse cx="850" cy="500" rx="50" ry="3" fill="#FFE7A0" fill-opacity="0.2"/>
  <ellipse cx="850" cy="525" rx="35" ry="2" fill="#FFE7A0" fill-opacity="0.12"/>

  <!-- Birds -->
  <g fill="none" stroke="#3D2F66" stroke-width="2.5" stroke-linecap="round">
    <path d="M 280 180 q 8 -10 16 0 q 8 -10 16 0"/>
    <path d="M 340 210 q 6 -8 12 0 q 6 -8 12 0"/>
    <path d="M 240 230 q 5 -7 10 0 q 5 -7 10 0"/>
  </g>

  <!-- Footer -->
  <text x="60" y="600" fill="#FFE7A0" font-family="-apple-system, sans-serif" font-size="14" opacity="0.8"
        letter-spacing="2">lingcoder.com
  </text>
</svg>
