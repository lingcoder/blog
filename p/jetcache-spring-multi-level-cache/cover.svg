<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#D8E0A8"/>
            <stop offset="0.45" stop-color="#A8C470"/>
            <stop offset="1" stop-color="#5C7E40"/>
        </linearGradient>
        <radialGradient id="lightBeam" cx="0.5" cy="0" r="0.7">
            <stop offset="0" stop-color="#FFFCE0" stop-opacity="0.55"/>
            <stop offset="1" stop-color="#FFFCE0" stop-opacity="0"/>
        </radialGradient>
    </defs>

    <rect width="1200" height="630" fill="url(#bg)"/>

    <!-- Light beams from above -->
    <ellipse cx="600" cy="0" rx="500" ry="500" fill="url(#lightBeam)"/>

    <!-- Bamboo stalks (back layer, faded) -->
    <g stroke="#A8C470" stroke-width="6" fill="none" opacity="0.4">
        <line x1="100" y1="0" x2="100" y2="630"/>
        <line x1="160" y1="0" x2="160" y2="630"/>
        <line x1="220" y1="0" x2="220" y2="630"/>
        <line x1="280" y1="0" x2="280" y2="630"/>
        <line x1="340" y1="0" x2="340" y2="630"/>
        <line x1="400" y1="0" x2="400" y2="630"/>
        <line x1="460" y1="0" x2="460" y2="630"/>
        <line x1="520" y1="0" x2="520" y2="630"/>
        <line x1="580" y1="0" x2="580" y2="630"/>
        <line x1="640" y1="0" x2="640" y2="630"/>
        <line x1="700" y1="0" x2="700" y2="630"/>
        <line x1="760" y1="0" x2="760" y2="630"/>
        <line x1="820" y1="0" x2="820" y2="630"/>
        <line x1="880" y1="0" x2="880" y2="630"/>
        <line x1="940" y1="0" x2="940" y2="630"/>
        <line x1="1000" y1="0" x2="1000" y2="630"/>
        <line x1="1060" y1="0" x2="1060" y2="630"/>
        <line x1="1120" y1="0" x2="1120" y2="630"/>
    </g>

    <!-- Bamboo stalks (front layer) -->
    <g>
        <!-- bamboo 1 -->
        <g stroke="#3A5C2A" stroke-width="14" fill="none">
            <line x1="180" y1="0" x2="180" y2="630"/>
        </g>
        <!-- nodes -->
        <g fill="#1F3A18">
            <ellipse cx="180" cy="80" rx="9" ry="3"/>
            <ellipse cx="180" cy="200" rx="9" ry="3"/>
            <ellipse cx="180" cy="320" rx="9" ry="3"/>
            <ellipse cx="180" cy="440" rx="9" ry="3"/>
            <ellipse cx="180" cy="560" rx="9" ry="3"/>
        </g>

        <!-- bamboo 2 -->
        <g stroke="#3A5C2A" stroke-width="16" fill="none">
            <line x1="380" y1="0" x2="380" y2="630"/>
        </g>
        <g fill="#1F3A18">
            <ellipse cx="380" cy="100" rx="10" ry="3.5"/>
            <ellipse cx="380" cy="240" rx="10" ry="3.5"/>
            <ellipse cx="380" cy="380" rx="10" ry="3.5"/>
            <ellipse cx="380" cy="520" rx="10" ry="3.5"/>
        </g>

        <!-- bamboo 3 -->
        <g stroke="#3A5C2A" stroke-width="14" fill="none">
            <line x1="600" y1="0" x2="600" y2="630"/>
        </g>
        <g fill="#1F3A18">
            <ellipse cx="600" cy="60" rx="9" ry="3"/>
            <ellipse cx="600" cy="180" rx="9" ry="3"/>
            <ellipse cx="600" cy="300" rx="9" ry="3"/>
            <ellipse cx="600" cy="420" rx="9" ry="3"/>
            <ellipse cx="600" cy="540" rx="9" ry="3"/>
        </g>

        <!-- bamboo 4 -->
        <g stroke="#3A5C2A" stroke-width="18" fill="none">
            <line x1="820" y1="0" x2="820" y2="630"/>
        </g>
        <g fill="#1F3A18">
            <ellipse cx="820" cy="120" rx="11" ry="4"/>
            <ellipse cx="820" cy="270" rx="11" ry="4"/>
            <ellipse cx="820" cy="420" rx="11" ry="4"/>
            <ellipse cx="820" cy="570" rx="11" ry="4"/>
        </g>

        <!-- bamboo 5 -->
        <g stroke="#3A5C2A" stroke-width="14" fill="none">
            <line x1="1020" y1="0" x2="1020" y2="630"/>
        </g>
        <g fill="#1F3A18">
            <ellipse cx="1020" cy="80" rx="9" ry="3"/>
            <ellipse cx="1020" cy="220" rx="9" ry="3"/>
            <ellipse cx="1020" cy="360" rx="9" ry="3"/>
            <ellipse cx="1020" cy="500" rx="9" ry="3"/>
        </g>
    </g>

    <!-- Bamboo leaves -->
    <g fill="#2E4A1A">
        <ellipse cx="180" cy="180" rx="22" ry="6" transform="rotate(-30 180 180)"/>
        <ellipse cx="380" cy="220" rx="25" ry="7" transform="rotate(20 380 220)"/>
        <ellipse cx="600" cy="160" rx="22" ry="6" transform="rotate(-20 600 160)"/>
        <ellipse cx="820" cy="250" rx="28" ry="8" transform="rotate(30 820 250)"/>
        <ellipse cx="1020" cy="200" rx="22" ry="6" transform="rotate(-25 1020 200)"/>
        <ellipse cx="180" cy="380" rx="22" ry="6" transform="rotate(25 180 380)"/>
        <ellipse cx="600" cy="400" rx="25" ry="7" transform="rotate(-20 600 400)"/>
        <ellipse cx="820" cy="450" rx="22" ry="6" transform="rotate(15 820 450)"/>
    </g>

    <text x="60" y="610" fill="#1F3A18" font-family="-apple-system, sans-serif" font-size="14" opacity="0.85"
          letter-spacing="2">lingcoder.com
    </text>
</svg>
