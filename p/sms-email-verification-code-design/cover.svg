<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
    <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#0F1F3A"/>
            <stop offset="1" stop-color="#3A4F70"/>
        </linearGradient>
        <radialGradient id="windowGlow" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#FFD085" stop-opacity="0.85"/>
            <stop offset="1" stop-color="#FFD085" stop-opacity="0"/>
        </radialGradient>
    </defs>

    <rect width="1200" height="630" fill="url(#sky)"/>

    <!-- Snow falling -->
    <g fill="#FFFFFF">
        <circle cx="80" cy="80" r="2" opacity="0.9"/>
        <circle cx="180" cy="160" r="2.5" opacity="0.85"/>
        <circle cx="280" cy="60" r="2" opacity="0.9"/>
        <circle cx="380" cy="200" r="2.5" opacity="0.8"/>
        <circle cx="480" cy="100" r="2" opacity="0.85"/>
        <circle cx="580" cy="180" r="2.5" opacity="0.9"/>
        <circle cx="680" cy="60" r="2" opacity="0.85"/>
        <circle cx="780" cy="200" r="2.5" opacity="0.8"/>
        <circle cx="880" cy="120" r="2" opacity="0.9"/>
        <circle cx="980" cy="180" r="2.5" opacity="0.85"/>
        <circle cx="1080" cy="80" r="2" opacity="0.9"/>
        <circle cx="1180" cy="160" r="2.5" opacity="0.85"/>
        <circle cx="120" cy="280" r="2" opacity="0.7"/>
        <circle cx="220" cy="360" r="2.5" opacity="0.8"/>
        <circle cx="350" cy="320" r="2" opacity="0.7"/>
        <circle cx="470" cy="350" r="2.5" opacity="0.75"/>
        <circle cx="640" cy="320" r="2" opacity="0.7"/>
        <circle cx="800" cy="350" r="2.5" opacity="0.8"/>
        <circle cx="950" cy="320" r="2" opacity="0.7"/>
        <circle cx="1100" cy="350" r="2.5" opacity="0.75"/>
    </g>

    <!-- Distant mountains -->
    <path d="M 0 380 L 200 270 L 380 340 L 560 250 L 740 330 L 920 270 L 1100 340 L 1200 310 L 1200 460 L 0 460 Z"
          fill="#5A6E96" opacity="0.85"/>
    <g fill="#FFFFFF" opacity="0.95">
        <path d="M 200 270 L 240 320 L 160 320 Z"/>
        <path d="M 560 250 L 600 305 L 520 305 Z"/>
        <path d="M 920 270 L 960 320 L 880 320 Z"/>
    </g>

    <!-- Snowy ground -->
    <path d="M 0 460 Q 600 430 1200 470 L 1200 630 L 0 630 Z" fill="#E0E5EC"/>
    <path d="M 0 510 Q 600 485 1200 515 L 1200 630 L 0 630 Z" fill="#A8B3CC"/>

    <!-- Pine trees with snow -->
    <g>
        <g transform="translate(80,560)">
            <polygon points="0,0 -28,-90 28,-90 0,-130 -22,-90 22,-90 0,-130" fill="#1F4028"/>
            <polygon points="0,0 -28,-90 28,-90" fill="#FFFFFF" opacity="0.5"/>
        </g>
        <g transform="translate(220,580)">
            <polygon points="0,0 -32,-100 32,-100 0,-150 -25,-100 25,-100 0,-150" fill="#1F4028"/>
            <polygon points="0,0 -32,-100 32,-100" fill="#FFFFFF" opacity="0.5"/>
        </g>
        <g transform="translate(960,575)">
            <polygon points="0,0 -32,-100 32,-100 0,-150 -25,-100 25,-100 0,-150" fill="#1F4028"/>
            <polygon points="0,0 -32,-100 32,-100" fill="#FFFFFF" opacity="0.5"/>
        </g>
        <g transform="translate(1100,570)">
            <polygon points="0,0 -28,-90 28,-90 0,-130 -22,-90 22,-90 0,-130" fill="#1F4028"/>
            <polygon points="0,0 -28,-90 28,-90" fill="#FFFFFF" opacity="0.5"/>
        </g>
    </g>

    <!-- Village cabins -->
    <g>
        <!-- Cabin 1 -->
        <g transform="translate(380,500)">
            <rect x="0" y="0" width="100" height="60" fill="#5A2D1F"/>
            <polygon points="-12,0 50,-40 112,0" fill="#FFFFFF"/>
            <polygon points="-8,3 50,-36 108,3" fill="#3A1812"/>
            <circle cx="50" cy="30" r="35" fill="url(#windowGlow)"/>
            <rect x="35" y="15" width="30" height="25" fill="#FFD085"/>
            <line x1="50" y1="15" x2="50" y2="40" stroke="#5A2D1F" stroke-width="1.5"/>
            <line x1="35" y1="27" x2="65" y2="27" stroke="#5A2D1F" stroke-width="1.5"/>
            <rect x="80" y="-15" width="10" height="14" fill="#5A2D1F"/>
        </g>
        <!-- Cabin 2 -->
        <g transform="translate(560,510)">
            <rect x="0" y="0" width="120" height="65" fill="#6E4128"/>
            <polygon points="-14,0 60,-46 134,0" fill="#FFFFFF"/>
            <polygon points="-10,3 60,-42 130,3" fill="#3A1812"/>
            <circle cx="40" cy="35" r="32" fill="url(#windowGlow)"/>
            <rect x="25" y="20" width="30" height="25" fill="#FFD085"/>
            <line x1="40" y1="20" x2="40" y2="45" stroke="#3A1812" stroke-width="1.5"/>
            <line x1="25" y1="32" x2="55" y2="32" stroke="#3A1812" stroke-width="1.5"/>
            <circle cx="85" cy="35" r="28" fill="url(#windowGlow)"/>
            <rect x="73" y="22" width="24" height="22" fill="#FFD085"/>
            <rect x="100" y="-18" width="12" height="16" fill="#3A1812"/>
        </g>
        <!-- Cabin 3 -->
        <g transform="translate(750,500)">
            <rect x="0" y="0" width="90" height="55" fill="#5A2D1F"/>
            <polygon points="-10,0 45,-35 100,0" fill="#FFFFFF"/>
            <polygon points="-7,3 45,-32 97,3" fill="#3A1812"/>
            <circle cx="45" cy="28" r="32" fill="url(#windowGlow)"/>
            <rect x="32" y="14" width="26" height="24" fill="#FFD085"/>
            <line x1="45" y1="14" x2="45" y2="38" stroke="#5A2D1F" stroke-width="1.5"/>
        </g>
    </g>

    <!-- Smoke from chimneys -->
    <g fill="#FFFFFF" opacity="0.5">
        <ellipse cx="465" cy="475" rx="10" ry="6"/>
        <ellipse cx="475" cy="455" rx="14" ry="8"/>
        <ellipse cx="485" cy="430" rx="18" ry="10"/>
        <ellipse cx="855" cy="475" rx="10" ry="6"/>
        <ellipse cx="865" cy="455" rx="14" ry="8"/>
    </g>

    <text x="60" y="608" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="14" opacity="0.85"
          letter-spacing="2">lingcoder.com
    </text>
</svg>
