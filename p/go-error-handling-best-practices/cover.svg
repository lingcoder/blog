<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
    <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#E89B5C"/>
            <stop offset="0.5" stop-color="#FFD08A"/>
            <stop offset="1" stop-color="#FFE5C0"/>
        </linearGradient>
        <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#D8C078"/>
            <stop offset="1" stop-color="#8C7038"/>
        </linearGradient>
    </defs>

    <rect width="1200" height="320" fill="url(#sky)"/>

    <!-- Sun rising -->
    <circle cx="600" cy="280" r="55" fill="#FFE5A0" opacity="0.95"/>
    <circle cx="600" cy="280" r="180" fill="#FFE5A0" opacity="0.18"/>

    <!-- Soft clouds -->
    <g fill="#FFFFFF" opacity="0.6">
        <ellipse cx="200" cy="120" rx="120" ry="10"/>
        <ellipse cx="900" cy="100" rx="140" ry="11"/>
    </g>

    <!-- Distant hills -->
    <path d="M 0 320 Q 200 270 400 300 T 800 290 T 1200 320 L 1200 380 L 0 380 Z"
          fill="url(#hill)" opacity="0.85"/>

    <!-- Mid hills -->
    <path d="M 0 380 Q 250 320 500 360 T 950 340 T 1200 380 L 1200 460 L 0 460 Z"
          fill="#A88B48"/>

    <!-- Foreground hills -->
    <path d="M 0 460 Q 300 400 600 450 T 1200 430 L 1200 630 L 0 630 Z"
          fill="#5C4218"/>

    <!-- Country road winding -->
    <path d="M 580 380 Q 550 450 480 510 Q 380 580 220 630 L 0 630 L 0 580 Q 200 540 350 490 Q 480 440 540 380 Z"
          fill="#E0D5A0"/>

    <!-- Road dashes -->
    <g stroke="#FFFFFF" stroke-width="2.5" stroke-dasharray="12 8" opacity="0.85" fill="none">
        <path d="M 580 390 Q 550 450 480 510 Q 380 580 220 630"/>
    </g>

    <!-- Telephone pole -->
    <g fill="#3A2814">
        <rect x="420" y="320" width="3" height="120"/>
        <rect x="408" y="320" width="27" height="3"/>
        <rect x="412" y="332" width="20" height="3"/>
    </g>
    <g fill="#3A2814">
        <rect x="270" y="380" width="3" height="140"/>
        <rect x="258" y="378" width="27" height="3"/>
    </g>

    <!-- Lone tree on hill -->
    <g transform="translate(880,460)">
        <rect x="-4" y="-30" width="8" height="40" fill="#3A2814"/>
        <ellipse cx="0" cy="-50" rx="35" ry="30" fill="#1F3A18"/>
        <ellipse cx="-10" cy="-60" rx="25" ry="20" fill="#3A5C2A"/>
        <ellipse cx="12" cy="-45" rx="22" ry="18" fill="#1F3A18"/>
    </g>

    <!-- Birds -->
    <g fill="none" stroke="#5C4218" stroke-width="2" stroke-linecap="round">
        <path d="M 320 200 q 6 -8 12 0 q 6 -8 12 0"/>
        <path d="M 380 230 q 5 -7 10 0 q 5 -7 10 0"/>
        <path d="M 850 180 q 5 -7 10 0 q 5 -7 10 0"/>
    </g>

    <text x="60" y="610" fill="#FFE5C0" font-family="-apple-system, sans-serif" font-size="14" opacity="0.85"
          letter-spacing="2">lingcoder.com
    </text>
</svg>
