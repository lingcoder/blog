<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1426"/>
      <stop offset="1" stop-color="#1A2D4A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1FC7D4"/>
      <stop offset="1" stop-color="#7645D9"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1FC7D4" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Decorative tick chart on right -->
  <g transform="translate(820, 130)" opacity="0.55">
    <rect x="0"   y="200" width="22" height="60"  fill="#1FC7D4"/>
    <rect x="32"  y="160" width="22" height="100" fill="#1FC7D4"/>
    <rect x="64"  y="120" width="22" height="140" fill="#1FC7D4"/>
    <rect x="96"  y="80"  width="22" height="180" fill="#FCC631"/>
    <rect x="128" y="50"  width="22" height="210" fill="#FCC631"/>
    <rect x="160" y="80"  width="22" height="180" fill="#FCC631"/>
    <rect x="192" y="120" width="22" height="140" fill="#7645D9"/>
    <rect x="224" y="160" width="22" height="100" fill="#7645D9"/>
    <rect x="256" y="200" width="22" height="60"  fill="#7645D9"/>
    <line x1="-10" y1="280" x2="298" y2="280" stroke="#1FC7D4" stroke-opacity="0.4" stroke-width="2"/>
    <text x="-12" y="300" fill="#1FC7D4" font-size="13" opacity="0.7">tick →  liquidity distribution</text>
  </g>

  <!-- Accent bar -->
  <rect x="80" y="180" width="6" height="60" fill="url(#accent)"/>

  <!-- Tag -->
  <text x="110" y="222" fill="#1FC7D4" font-size="22" font-weight="600" letter-spacing="2">DEFI · SMART CONTRACT</text>

  <!-- Title -->
  <text x="80" y="320" fill="#FFFFFF" font-size="72" font-weight="800" letter-spacing="-1">PancakeSwap V3</text>
  <text x="80" y="400" fill="#FFFFFF" font-size="56" font-weight="600">合约架构深度解析</text>

  <!-- Subtitle -->
  <text x="80" y="470" fill="#8FA8D6" font-size="22">从 Factory、Pool、NFT 仓位管理到流动性挖矿</text>

  <!-- Footer -->
  <text x="80" y="560" fill="#FCC631" font-size="18" font-weight="600">lingcoder.com</text>
  <text x="80" y="585" fill="#5C7099" font-size="14">2026 · Concentrated Liquidity AMM</text>

  <!-- Tag pill -->
  <g transform="translate(960, 540)">
    <rect x="0" y="0" width="160" height="36" rx="18" fill="#1FC7D4" fill-opacity="0.15" stroke="#1FC7D4" stroke-opacity="0.5"/>
    <text x="80" y="23" fill="#1FC7D4" font-size="14" font-weight="600" text-anchor="middle">CONCENTRATED LP</text>
  </g>
</svg>
