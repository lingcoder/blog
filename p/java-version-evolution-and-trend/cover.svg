<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
    <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#88C0E0"/>
            <stop offset="1" stop-color="#FFE5DC"/>
        </linearGradient>
    </defs>

    <rect width="1200" height="430" fill="url(#sky)"/>

    <!-- Soft sun -->
    <circle cx="900" cy="160" r="45" fill="#FFE5A0" opacity="0.95"/>
    <circle cx="900" cy="160" r="100" fill="#FFE5A0" opacity="0.2"/>

    <!-- Soft clouds -->
    <g fill="#FFFFFF" opacity="0.85">
        <ellipse cx="200" cy="100" rx="100" ry="20"/>
        <ellipse cx="240" cy="85" rx="70" ry="16"/>
        <ellipse cx="500" cy="130" rx="120" ry="22"/>
        <ellipse cx="540" cy="115" rx="85" ry="18"/>
    </g>

    <!-- Distant rolling hills -->
    <path d="M 0 430 Q 200 380 400 410 Q 600 370 800 410 Q 1000 380 1200 410 L 1200 470 L 0 470 Z" fill="#A8D098"
          opacity="0.6"/>
    <path d="M 0 450 Q 250 410 500 440 Q 750 410 1000 450 Q 1100 440 1200 450 L 1200 510 L 0 510 Z" fill="#7CAC68"
          opacity="0.85"/>

    <!-- Foreground meadow -->
    <path d="M 0 480 Q 600 460 1200 490 L 1200 540 L 0 540 Z" fill="#9CC880"/>
    <path d="M 0 520 Q 600 500 1200 530 L 1200 580 L 0 580 Z" fill="#7CAC68"/>
    <path d="M 0 560 Q 600 540 1200 570 L 1200 630 L 0 630 Z" fill="#5C8C50"/>

    <!-- Cherry/blossom tree mid -->
    <g transform="translate(180,470)">
        <rect x="-8" y="0" width="16" height="50" fill="#5C3820"/>
        <line x1="0" y1="0" x2="-25" y2="-25" stroke="#5C3820" stroke-width="6"/>
        <line x1="0" y1="0" x2="25" y2="-25" stroke="#5C3820" stroke-width="6"/>
        <g fill="#FFC0D8">
            <circle cx="0" cy="-40" r="38"/>
            <circle cx="-26" cy="-25" r="28"/>
            <circle cx="28" cy="-30" r="32"/>
            <circle cx="-12" cy="-60" r="26"/>
            <circle cx="20" cy="-65" r="28"/>
        </g>
        <g fill="#FFE5EC" opacity="0.85">
            <circle cx="-15" cy="-35" r="18"/>
            <circle cx="18" cy="-45" r="20"/>
        </g>
    </g>

    <!-- Yellow flowering tree -->
    <g transform="translate(1020,475)">
        <rect x="-8" y="0" width="16" height="50" fill="#5C3820"/>
        <line x1="0" y1="0" x2="-25" y2="-25" stroke="#5C3820" stroke-width="6"/>
        <line x1="0" y1="0" x2="25" y2="-25" stroke="#5C3820" stroke-width="6"/>
        <g fill="#FFE068">
            <circle cx="0" cy="-40" r="38"/>
            <circle cx="-26" cy="-25" r="28"/>
            <circle cx="28" cy="-30" r="32"/>
            <circle cx="-12" cy="-60" r="26"/>
            <circle cx="20" cy="-65" r="28"/>
        </g>
        <g fill="#FFF4A8" opacity="0.85">
            <circle cx="-15" cy="-35" r="18"/>
            <circle cx="18" cy="-45" r="20"/>
        </g>
    </g>

    <!-- Path through meadow -->
    <path d="M 580 480 Q 600 530 540 580 Q 480 620 400 630 L 720 630 Q 660 600 660 570 Q 680 530 620 480 Z"
          fill="#D8C8A8" opacity="0.85"/>

    <!-- Wildflowers -->
    <g>
        <g transform="translate(80,540)">
            <circle r="5" fill="#FFFFFF"/>
            <circle r="2" fill="#FFE0A0"/>
        </g>
        <g transform="translate(140,560)">
            <circle r="4" fill="#FFB0C8"/>
            <circle r="2" fill="#FFE0A0"/>
        </g>
        <g transform="translate(280,570)">
            <circle r="5" fill="#E8B0FF"/>
            <circle r="2" fill="#FFE0A0"/>
        </g>
        <g transform="translate(360,545)">
            <circle r="4" fill="#FFFFFF"/>
            <circle r="2" fill="#FFE0A0"/>
        </g>
        <g transform="translate(880,565)">
            <circle r="5" fill="#FFFFFF"/>
            <circle r="2" fill="#FFE0A0"/>
        </g>
        <g transform="translate(940,545)">
            <circle r="4" fill="#FFB0C8"/>
            <circle r="2" fill="#FFE0A0"/>
        </g>
        <g transform="translate(1080,575)">
            <circle r="5" fill="#E8B0FF"/>
            <circle r="2" fill="#FFE0A0"/>
        </g>
        <g transform="translate(1140,555)">
            <circle r="4" fill="#FFFFFF"/>
            <circle r="2" fill="#FFE0A0"/>
        </g>
        <g transform="translate(40,580)">
            <circle r="4" fill="#FFB0C8"/>
        </g>
        <g transform="translate(1160,600)">
            <circle r="4" fill="#FFFFFF"/>
        </g>
    </g>

    <!-- Butterflies -->
    <g fill="#FFA8D0">
        <g transform="translate(450,400)">
            <ellipse cx="-4" cy="-2" rx="5" ry="4"/>
            <ellipse cx="4" cy="-2" rx="5" ry="4"/>
            <ellipse cx="-4" cy="3" rx="4" ry="3"/>
            <ellipse cx="4" cy="3" rx="4" ry="3"/>
        </g>
        <g transform="translate(750,420)">
            <ellipse cx="-4" cy="-2" rx="5" ry="4"/>
            <ellipse cx="4" cy="-2" rx="5" ry="4"/>
            <ellipse cx="-4" cy="3" rx="4" ry="3"/>
            <ellipse cx="4" cy="3" rx="4" ry="3"/>
        </g>
    </g>

    <!-- Birds -->
    <g fill="none" stroke="#3D5040" stroke-width="2" stroke-linecap="round">
        <path d="M 380 220 q 6 -7 12 0 q 6 -7 12 0"/>
        <path d="M 700 200 q 5 -6 10 0 q 5 -6 10 0"/>
    </g>

    <text x="60" y="618" fill="#3D5828" font-family="-apple-system, sans-serif" font-size="14" opacity="0.85"
          letter-spacing="2">lingcoder.com
    </text>
</svg>
