<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#7CA8C0"/>
          <stop offset="1" stop-color="#FFC890"/>
      </linearGradient>
      <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#5C7895"/>
          <stop offset="1" stop-color="#2A3D5C"/>
    </linearGradient>
  </defs>

    <rect width="1200" height="350" fill="url(#sky)"/>

    <!-- Distant mountains -->
    <path d="M 0 320 L 180 230 L 360 280 L 540 220 L 720 270 L 900 210 L 1080 260 L 1200 240 L 1200 350 L 0 350 Z"
          fill="#A8957C" opacity="0.6"/>

    <!-- Autumn forest line -->
    <g>
        <ellipse cx="80" cy="320" rx="50" ry="34" fill="#D8401C"/>
        <ellipse cx="170" cy="315" rx="60" ry="40" fill="#FF7C30"/>
        <ellipse cx="270" cy="320" rx="55" ry="36" fill="#B82E14"/>
        <ellipse cx="360" cy="318" rx="60" ry="38" fill="#FFA438"/>
        <ellipse cx="450" cy="322" rx="55" ry="34" fill="#D8401C"/>
        <ellipse cx="540" cy="316" rx="60" ry="40" fill="#FF6B2E"/>
        <ellipse cx="640" cy="320" rx="58" ry="36" fill="#B82E14"/>
        <ellipse cx="740" cy="318" rx="55" ry="38" fill="#FFA438"/>
        <ellipse cx="840" cy="322" rx="60" ry="34" fill="#D8401C"/>
        <ellipse cx="940" cy="316" rx="55" ry="40" fill="#FF7C30"/>
        <ellipse cx="1040" cy="320" rx="60" ry="36" fill="#B82E14"/>
        <ellipse cx="1140" cy="318" rx="55" ry="38" fill="#FFA438"/>
    </g>

    <!-- Lake -->
    <rect y="350" width="1200" height="280" fill="url(#lake)"/>

    <!-- Lake reflection of forest (blurred + dim) -->
    <g opacity="0.5">
        <ellipse cx="80" cy="380" rx="48" ry="20" fill="#D8401C"/>
        <ellipse cx="170" cy="385" rx="58" ry="22" fill="#FF7C30"/>
        <ellipse cx="270" cy="380" rx="53" ry="20" fill="#B82E14"/>
        <ellipse cx="360" cy="385" rx="58" ry="22" fill="#FFA438"/>
        <ellipse cx="450" cy="380" rx="53" ry="20" fill="#D8401C"/>
        <ellipse cx="540" cy="385" rx="58" ry="22" fill="#FF6B2E"/>
        <ellipse cx="640" cy="380" rx="56" ry="20" fill="#B82E14"/>
        <ellipse cx="740" cy="385" rx="53" ry="22" fill="#FFA438"/>
        <ellipse cx="840" cy="380" rx="58" ry="20" fill="#D8401C"/>
        <ellipse cx="940" cy="385" rx="53" ry="22" fill="#FF7C30"/>
        <ellipse cx="1040" cy="380" rx="58" ry="20" fill="#B82E14"/>
        <ellipse cx="1140" cy="385" rx="53" ry="22" fill="#FFA438"/>
    </g>

    <!-- Ripples -->
    <g fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5">
        <path d="M 200 480 q 30 -4 60 0 t 60 0"/>
        <path d="M 500 510 q 40 -5 80 0 t 80 0"/>
        <path d="M 800 490 q 30 -4 60 0 t 60 0"/>
        <path d="M 200 555 q 50 -6 100 0 t 100 0"/>
    </g>

    <!-- Small boat -->
    <g transform="translate(750,470)" fill="#3A2510">
        <path d="M -25 0 L 25 0 L 20 8 L -20 8 Z"/>
        <line x1="0" y1="0" x2="0" y2="-22" stroke="#3A2510" stroke-width="2"/>
        <polygon points="0,-22 0,-3 12,-12"/>
  </g>

    <text x="60" y="610" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="14" opacity="0.8"
          letter-spacing="2">lingcoder.com
    </text>
</svg>
