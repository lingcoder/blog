<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A2433"/>
      <stop offset="1" stop-color="#0F1A26"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#5D8AA8" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- 流水线 -->
  <g transform="translate(180,290)" font-family="monospace" font-size="12">
    <g transform="translate(0,0)">
      <circle r="32" fill="#5D8AA8" fill-opacity="0.2" stroke="#5D8AA8" stroke-width="2.5"/>
      <text y="6" text-anchor="middle" fill="#A4C8E1">code</text>
    </g>
    <line x1="32" y1="0" x2="170" y2="0" stroke="#5D8AA8" stroke-width="2"/>
    <g transform="translate(200,0)">
      <circle r="32" fill="#5D8AA8" fill-opacity="0.2" stroke="#5D8AA8" stroke-width="2.5"/>
      <text y="6" text-anchor="middle" fill="#A4C8E1">build</text>
    </g>
    <line x1="232" y1="0" x2="370" y2="0" stroke="#5D8AA8" stroke-width="2"/>
    <g transform="translate(400,0)">
      <circle r="32" fill="#5D8AA8" fill-opacity="0.2" stroke="#5D8AA8" stroke-width="2.5"/>
      <text y="6" text-anchor="middle" fill="#A4C8E1">test</text>
    </g>
    <line x1="432" y1="0" x2="570" y2="0" stroke="#5D8AA8" stroke-width="2"/>
    <g transform="translate(600,0)">
      <circle r="32" fill="#5D8AA8" fill-opacity="0.2" stroke="#5D8AA8" stroke-width="2.5"/>
      <text y="6" text-anchor="middle" fill="#A4C8E1">deploy</text>
    </g>
    <line x1="632" y1="0" x2="770" y2="0" stroke="#5D8AA8" stroke-width="2"/>
    <g transform="translate(800,0)">
      <circle r="32" fill="#FCC631" fill-opacity="0.25" stroke="#FCC631" stroke-width="3"/>
      <text y="6" text-anchor="middle" fill="#FCC631">prod</text>
    </g>
  </g>

  <text x="80" y="555" fill="#FCC631" font-size="20" font-weight="700" font-family="-apple-system, sans-serif">DevOps</text>
  <text x="80" y="582" fill="#A4C8E1" font-size="13" font-family="-apple-system, sans-serif" letter-spacing="3">BUILD · CI/CD · TOOLING</text>
</svg>
