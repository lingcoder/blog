<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A2A1F"/>
      <stop offset="1" stop-color="#051A14"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#16a085" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- 神经网络 -->
  <g transform="translate(280,160)">
    <!-- Layer 1 -->
    <g fill="#16a085" fill-opacity="0.25" stroke="#16a085" stroke-width="2">
      <circle cx="0"   cy="40"  r="18"/>
      <circle cx="0"   cy="120" r="18"/>
      <circle cx="0"   cy="200" r="18"/>
      <circle cx="0"   cy="280" r="18"/>
    </g>
    <!-- Layer 2 -->
    <g fill="#1abc9c" fill-opacity="0.3" stroke="#1abc9c" stroke-width="2">
      <circle cx="220" cy="20"  r="20"/>
      <circle cx="220" cy="100" r="20"/>
      <circle cx="220" cy="180" r="20"/>
      <circle cx="220" cy="260" r="20"/>
      <circle cx="220" cy="300" r="20"/>
    </g>
    <!-- Layer 3 -->
    <g fill="#2ecc71" fill-opacity="0.3" stroke="#2ecc71" stroke-width="2">
      <circle cx="440" cy="50"  r="20"/>
      <circle cx="440" cy="130" r="20"/>
      <circle cx="440" cy="210" r="20"/>
      <circle cx="440" cy="290" r="20"/>
    </g>
    <!-- Layer 4 (output) -->
    <g fill="#FCC631" fill-opacity="0.4" stroke="#FCC631" stroke-width="2.5">
      <circle cx="640" cy="120" r="22"/>
      <circle cx="640" cy="200" r="22"/>
    </g>
    <!-- 连线 -->
    <g stroke="#16a085" stroke-opacity="0.25" stroke-width="1">
      <line x1="0" y1="40" x2="220" y2="20"/>
      <line x1="0" y1="40" x2="220" y2="100"/>
      <line x1="0" y1="40" x2="220" y2="180"/>
      <line x1="0" y1="120" x2="220" y2="20"/>
      <line x1="0" y1="120" x2="220" y2="100"/>
      <line x1="0" y1="120" x2="220" y2="180"/>
      <line x1="0" y1="200" x2="220" y2="180"/>
      <line x1="0" y1="200" x2="220" y2="260"/>
      <line x1="0" y1="280" x2="220" y2="260"/>
      <line x1="0" y1="280" x2="220" y2="300"/>

      <line x1="220" y1="20"  x2="440" y2="50"/>
      <line x1="220" y1="100" x2="440" y2="50"/>
      <line x1="220" y1="100" x2="440" y2="130"/>
      <line x1="220" y1="180" x2="440" y2="130"/>
      <line x1="220" y1="180" x2="440" y2="210"/>
      <line x1="220" y1="260" x2="440" y2="210"/>
      <line x1="220" y1="260" x2="440" y2="290"/>
      <line x1="220" y1="300" x2="440" y2="290"/>

      <line x1="440" y1="50"  x2="640" y2="120"/>
      <line x1="440" y1="130" x2="640" y2="120"/>
      <line x1="440" y1="130" x2="640" y2="200"/>
      <line x1="440" y1="210" x2="640" y2="200"/>
      <line x1="440" y1="290" x2="640" y2="200"/>
    </g>
  </g>

  <text x="80" y="555" fill="#1abc9c" font-size="20" font-weight="700" font-family="-apple-system, sans-serif">人工智能</text>
  <text x="80" y="582" fill="#1abc9c" font-size="13" font-family="-apple-system, sans-serif" letter-spacing="3">AI · LLM · AGENT</text>
</svg>
