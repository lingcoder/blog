<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1A2A"/>
      <stop offset="1" stop-color="#04101A"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#3776ab" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- 双蛇形（Python logo 简化版） -->
  <g transform="translate(540,180)">
    <!-- 蓝蛇上半 -->
    <path d="M 60 0
             Q 0 0 0 60
             L 0 130
             L 120 130
             L 120 90
             L 30 90
             L 30 30
             L 90 30
             Q 130 30 130 70
             L 130 130
             Z"
          fill="#3776ab" fill-opacity="0.7" stroke="#3776ab" stroke-width="2"/>
    <circle cx="40" cy="20" r="8" fill="#fff"/>
    <!-- 黄蛇下半 -->
    <path d="M 70 270
             Q 130 270 130 210
             L 130 140
             L 10 140
             L 10 180
             L 100 180
             L 100 240
             L 40 240
             Q 0 240 0 200
             L 0 140
             Z"
          fill="#ffd43b" fill-opacity="0.7" stroke="#ffd43b" stroke-width="2"/>
    <circle cx="90" cy="250" r="8" fill="#fff"/>
  </g>

  <text x="80" y="555" fill="#ffd43b" font-size="20" font-weight="700" font-family="-apple-system, sans-serif">Python</text>
  <text x="80" y="582" fill="#9CC9E8" font-size="13" font-family="-apple-system, sans-serif" letter-spacing="3">SCRIPTING · DATA · AI</text>
</svg>
