<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#01243F"/>
      <stop offset="1" stop-color="#01101F"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#02569B" stroke-opacity="0.1" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Flutter logo 简化版 -->
  <g transform="translate(530,180)">
    <!-- 主三角形 -->
    <polygon points="120,0 240,120 180,180 60,60" fill="#54C5F8" fill-opacity="0.8" stroke="#54C5F8" stroke-width="2"/>
    <polygon points="60,60 180,180 120,240 0,120" fill="#02569B" fill-opacity="0.85" stroke="#02569B" stroke-width="2"/>
    <polygon points="120,240 240,120 180,60 60,180" fill="#54C5F8" fill-opacity="0.6" stroke="#54C5F8" stroke-width="2"/>
  </g>

  <text x="80" y="555" fill="#54C5F8" font-size="20" font-weight="700" font-family="-apple-system, sans-serif">Flutter</text>
  <text x="80" y="582" fill="#9CC9E8" font-size="13" font-family="-apple-system, sans-serif" letter-spacing="3">DART · CROSS-PLATFORM UI</text>
</svg>
