<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241B0A"/>
      <stop offset="1" stop-color="#1A1106"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#f39c12" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- 蜡烛图 -->
  <g transform="translate(280,180)">
    <line x1="0" y1="200" x2="640" y2="200" stroke="#f39c12" stroke-opacity="0.4" stroke-width="2"/>
    <g stroke-width="2">
      <line x1="40"  y1="40" x2="40"  y2="160" stroke="#27ae60"/>
      <rect x="30"  y="60" width="20" height="80" fill="#27ae60" fill-opacity="0.6" stroke="#27ae60"/>
      <line x1="100" y1="20" x2="100" y2="170" stroke="#27ae60"/>
      <rect x="90"  y="40" width="20" height="100" fill="#27ae60" fill-opacity="0.6" stroke="#27ae60"/>
      <line x1="160" y1="60" x2="160" y2="180" stroke="#e74c3c"/>
      <rect x="150" y="80" width="20" height="80" fill="#e74c3c" fill-opacity="0.6" stroke="#e74c3c"/>
      <line x1="220" y1="30" x2="220" y2="150" stroke="#27ae60"/>
      <rect x="210" y="50" width="20" height="80" fill="#27ae60" fill-opacity="0.6" stroke="#27ae60"/>
      <line x1="280" y1="10" x2="280" y2="120" stroke="#27ae60"/>
      <rect x="270" y="20" width="20" height="80" fill="#27ae60" fill-opacity="0.6" stroke="#27ae60"/>
      <line x1="340" y1="20" x2="340" y2="160" stroke="#e74c3c"/>
      <rect x="330" y="40" width="20" height="100" fill="#e74c3c" fill-opacity="0.6" stroke="#e74c3c"/>
      <line x1="400" y1="60" x2="400" y2="180" stroke="#e74c3c"/>
      <rect x="390" y="80" width="20" height="80" fill="#e74c3c" fill-opacity="0.6" stroke="#e74c3c"/>
      <line x1="460" y1="100" x2="460" y2="190" stroke="#27ae60"/>
      <rect x="450" y="120" width="20" height="60" fill="#27ae60" fill-opacity="0.6" stroke="#27ae60"/>
      <line x1="520" y1="50" x2="520" y2="160" stroke="#27ae60"/>
      <rect x="510" y="70" width="20" height="80" fill="#27ae60" fill-opacity="0.6" stroke="#27ae60"/>
      <line x1="580" y1="20" x2="580" y2="140" stroke="#27ae60"/>
      <rect x="570" y="30" width="20" height="100" fill="#27ae60" fill-opacity="0.6" stroke="#27ae60"/>
    </g>
  </g>

  <text x="80" y="555" fill="#f39c12" font-size="20" font-weight="700" font-family="-apple-system, sans-serif">币圈故事</text>
  <text x="80" y="582" fill="#FCC631" font-size="13" font-family="-apple-system, sans-serif" letter-spacing="3">CRYPTO · STORIES</text>
</svg>
